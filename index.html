<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #050505; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 9:16 Vertical Image Fix */
        #sukuun-img { width: 100%; height: 60vh; background-size: cover; background-position: center; background-repeat: no-repeat; transition: 0.5s; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #050505; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; }
        .ai { background: #1e293b; align-self: flex-start; }
        .user { background: #6366f1; align-self: flex-end; }
        
        .input-area { padding: 15px; background: #000; display: flex; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img"></div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" class="w-full p-3 rounded-xl bg-gray-800 text-white outline-none" placeholder="Kuch kaho...">
            <button onclick="send()" class="ml-2 bg-indigo-600 px-4 rounded-xl">Send</button>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId') || 'u_' + Date.now();
        localStorage.setItem('userId', userId);
        const gender = localStorage.getItem('gender') || 'female';
        
        // Image path absolute (server root se)
        const imgPath = gender === 'female' ? '/best_female.png' : '/best_male.png';
        document.getElementById('sukuun-img').style.backgroundImage = `url('${imgPath}')`;

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            document.getElementById('messages').innerHTML += `<div class="msg user">${input.value}</div>`;
            const userMsg = input.value; input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: userMsg, userId })
            });
            const data = await res.json();
            document.getElementById('messages').innerHTML += `<div class="msg ai">${data.reply}</div>`;
            
            // Clean Voice Logic
            const cleanText = data.reply.replace(/[^\w\s.,?!]/g, ""); 
            const speech = new SpeechSynthesisUtterance(cleanText);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
