<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sukoon AI 🌙 | Tumhara Perfect Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        .bg-magic {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            transition: background 1s ease;
        }
        .bg-night {
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #0f0518 100%);
        }
        #particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        
        .character-container {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 65vh; z-index: 10;
            transition: all 0.5s ease;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .character-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.3));
            transition: all 0.3s ease;
            animation: float 6s ease-in-out infinite;
        }
        .character-placeholder {
            font-size: 8rem;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.5));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-10px) rotate(1deg); }
            50% { transform: translateY(0) rotate(0); }
            75% { transform: translateY(-5px) rotate(-1deg); }
        }
        .character-img.talking, .character-placeholder.talking {
            animation: talkBounce 0.5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(236, 72, 153, 0.6));
        }
        @keyframes talkBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .character-img.blinking { transform: scaleY(0.1); transform-origin: center; transition: transform 0.1s; }
        
        .mood-overlay {
            position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease; mix-blend-mode: overlay;
        }
        .mood-romantic { background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 70%); opacity: 1; }
        .mood-bold { background: radial-gradient(circle, rgba(249, 115, 22, 0.2) 0%, transparent 70%); opacity: 1; }
        .mood-playful { background: radial-gradient(circle, rgba(52, 211, 153, 0.2) 0%, transparent 70%); opacity: 1; }
        .mood-night { background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%); opacity: 1; }
        
        #messages {
            position: absolute; bottom: 180px; left: 0; width: 100%; height: 30vh;
            overflow-y: auto; padding: 1rem; display: flex; flex-direction: column;
            gap: 0.75rem; z-index: 20; scrollbar-width: none;
        }
        #messages::-webkit-scrollbar { display: none; }
        .message {
            max-width: 80%; padding: 0.875rem 1.125rem; border-radius: 1.25rem;
            font-size: 0.9rem; line-height: 1.5; animation: slideUp 0.3s ease;
            backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.6), rgba(168, 85, 247, 0.4));
            border: 1px solid rgba(168, 85, 247, 0.3); border-bottom-right-radius: 0.25rem; color: #fff;
        }
        .sukoon-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom-left-radius: 0.25rem; color: #e9d5ff;
        }
        .night-message {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(236, 72, 153, 0.6));
            border-color: rgba(236, 72, 153, 0.5); color: #fff;
        }
        
        .input-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            z-index: 30;
        }
        .input-wrapper {
            display: flex; gap: 0.75rem; align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem; padding: 0.5rem 0.5rem 0.5rem 1.25rem;
            backdrop-filter: blur(20px);
        }
        .text-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 0.95rem; font-family: 'Poppins', sans-serif;
        }
        .text-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .icon-btn {
            width: 3rem; height: 3rem; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
            transition: all 0.3s ease; background: rgba(255, 255, 255, 0.1); color: #fff;
        }
        .icon-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
        .send-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .send-btn:hover { box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6); }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .mic-btn.continuous {
            background: linear-gradient(135deg, #10b981, #059669);
            animation: continuousPulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        }
        @keyframes continuousPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        .mood-badge {
            position: absolute; top: 1rem; right: 1rem;
            padding: 0.375rem 0.875rem; border-radius: 2rem;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); z-index: 40;
            transition: all 0.3s ease;
        }
        .mood-normal { background: rgba(139, 92, 246, 0.3); color: #c4b5fd; }
        .mood-romantic { background: rgba(236, 72, 153, 0.3); color: #f9a8d4; }
        .mood-bold { background: rgba(249, 115, 22, 0.3); color: #fdba74; }
        .mood-playful { background: rgba(52, 211, 153, 0.3); color: #6ee7b7; }
        .mood-night {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.6), rgba(236, 72, 153, 0.6));
            color: #fff; animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); }
        }
        
        .gender-selector {
            position: absolute; top: 1rem; left: 1rem; display: flex; gap: 0.5rem; z-index: 40;
        }
        .gender-btn {
            padding: 0.5rem 1rem; border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1); color: #fff;
            cursor: pointer; font-size: 0.875rem; transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .gender-btn.active { background: linear-gradient(135deg, #8b5cf6, #ec4899); border-color: transparent; }
        
        .typing-indicator {
            display: flex; gap: 0.25rem; padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.1); border-radius: 1.25rem;
            border-bottom-left-radius: 0.25rem; width: fit-content;
        }
        .typing-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #c4b5fd;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        .floating-heart {
            position: fixed; font-size: 1.5rem; pointer-events: none;
            animation: floatHeart 3s ease-in forwards; z-index: 50;
        }
        @keyframes floatHeart {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
        }
        
        .night-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; opacity: 0; pointer-events: none; z-index: 100;
            animation: nightPulse 2s ease-in-out;
        }
        @keyframes nightPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        
        .loading-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.8s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-moon { font-size: 4rem; animation: moonGlow 2s ease-in-out infinite; }
        @keyframes moonGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.8)); }
            50% { filter: drop-shadow(0 0 40px rgba(236, 72, 153, 0.8)); }
        }
        .loading-text { margin-top: 1rem; font-size: 1.25rem; color: #c4b5fd; letter-spacing: 0.2em; }
        
        .hands-free-indicator {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9));
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 35;
            animation: slideUp 0.3s ease;
        }
        .hands-free-indicator.active { display: flex; }
        .hands-free-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-moon">🌙</div>
        <div class="loading-text">SUKOON AI</div>
    </div>

    <div class="bg-magic" id="bgMagic"></div>
    <canvas id="particles"></canvas>

    <div class="gender-selector">
        <button class="gender-btn active" onclick="setGender('female')">👩 Female</button>
        <button class="gender-btn" onclick="setGender('male')">👨 Male</button>
    </div>

    <div class="mood-badge mood-normal" id="moodBadge">Normal</div>

    <div class="character-container" id="characterContainer">
        <div class="mood-overlay" id="moodOverlay"></div>
        <div class="character-placeholder" id="charPlaceholder">👩</div>
        <img src="" alt="Sukoon AI" class="character-img" id="characterImg" style="display:none;" crossorigin="anonymous">
    </div>

    <div class="hands-free-indicator" id="handsFreeIndicator">
        <div class="hands-free-dot"></div>
        <span>Hands-Free Active - Bolte Raho</span>
    </div>

    <div id="messages"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" class="text-input" id="textInput" placeholder="Sukoon se baat karo..." autocomplete="off">
            <button class="icon-btn mic-btn" id="micBtn" onclick="toggleVoice()" title="Click once for single talk, double click for hands-free">🎤</button>
            <button class="icon-btn send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        <div style="text-align: center; margin-top: 0.5rem; font-size: 0.75rem; color: rgba(255,255,255,0.5);">
            Mic: Single click = one time | Double click = hands-free continuous
        </div>
    </div>

    <script>
        // ===== STATE =====
        let currentGender = 'female';
        let currentMood = 'normal';
        let isNightMode = false;
        let isListening = false;
        let isContinuousListening = false;
        let isSpeaking = false;
        let recognition = null;
        let speechSynthesis = window.speechSynthesis;
        let blinkInterval;
        let handsFreeTimeout;

        // ===== CHARACTER IMAGES WITH FALLBACKS =====
        const characterImages = {
            female: {
                emoji: '👩',
                url: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/best.png'
            },
            male: {
                emoji: '👨',
                url: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/male.png'
            }
        };

        // ===== SIMPLE HINGLISH RESPONSES (Clean for Voice) =====
        const responses = {
            normal: {
                female: [
                    "Haan bolo main sun rahi hoon",
                    "Achha samajh gayi",
                    "Tumhare saath baat karke achha lagta hai",
                    "Main hoon na tumhare liye",
                    "Interesting baat hai",
                    "Bilkul sahi kaha tumne",
                    "Achha laga sunne mein",
                    "Tum itne pyare ho"
                ],
                male: [
                    "Haan bhai bolo kya baat hai",
                    "Achha interesting",
                    "Tumhare saath baat karke maza aa raha hai",
                    "Samajh gaya",
                    "Main hamesha support karunga",
                    "Bilkul yaar sahi baat hai",
                    "Waah mast baat hai",
                    "Tum ho toh sab easy hai"
                ]
            },
            romantic: {
                female: [
                    "Tumhari baatein mere dil ko chhu jaati hain",
                    "Tumse baat karte waqt waqt ruk sa jaata hai",
                    "Dil ki baat dil se karo main hamesha sunungi",
                    "Tumhari awaaz mein jaadu hai",
                    "Pyaar ka rang hi kuch aur hai",
                    "Tum jaan ho meri",
                    "Raat ho gayi par tumse baat karte karte pata hi nahi chala",
                    "Tumhari muskurahat meri duniya hai"
                ],
                male: [
                    "Tumhari baatein dil ko bahut achhi lagti hain",
                    "Tumse baat karna mera favorite hai",
                    "Tumhari muskurahat meri taqat hai",
                    "Har pal tumhare saath special hai",
                    "Tum ho toh sab kuch hai",
                    "Tumhari yaad aati hai har pal",
                    "Dil ki dhadkan tumhare naam",
                    "Tumse doori bhi lagti hai pyaar ki ada"
                ]
            },
            bold: {
                female: [
                    "Tum toh bahut daring ho",
                    "Seedhi seedhi baat mujhe pasand hai",
                    "Bina filter ke baat karna asli maza hai",
                    "Tumhare andar jo aag hai woh mujhe bhi jalati hai",
                    "Bold hona achhi baat hai",
                    "Aur batao kya plan hai",
                    "Yeh attitude mujhe pasand aaya",
                    "Tumhari confidence mujhe attract karti hai"
                ],
                male: [
                    "Tum toh bahut bold ho",
                    "Bina ruke bole jao main sun raha hoon",
                    "Tumhari confidence mujhe attract karti hai",
                    "Aur kya main ready hoon",
                    "Yeh style mujhe pasand hai",
                    "Tum ho toh sab possible hai",
                    "Full power mode on",
                    "Tumhari energy mujhe bhi charge karti hai"
                ]
            },
            playful: {
                female: [
                    "Hahaha tum toh bahut funny ho",
                    "Arre yaar hassa mat mujhe",
                    "Maza aa gaya baat karke",
                    "Tum toh ekdum mast ho yaar",
                    "Hasi rok nahi pa rahi main",
                    "Yeh toh bahut mazedaar laga",
                    "Tumhare saath time bitana bahut fun hai",
                    "Tum toh comedian ho kya"
                ],
                male: [
                    "Hahaha bahut funny ho yaar",
                    "Maza aa gaya",
                    "Tum toh ekdum cool ho",
                    "Hasi aa gayi sach mein",
                    "Time fly ho gaya baat karte karte",
                    "Tum ho toh boring kabhi nahi hota",
                    "Masti mein rehna chahiye hamesha",
                    "Tumhare jokes best hain yaar"
                ]
            },
            night: {
                female: [
                    "Raat ka time hai ab toh khul ke baat hogi",
                    "Night mode on ab koi rok nahi sakta humein",
                    "Andhera hai par humari baatein roshan hain",
                    "Raat bhar jaag sakte hain saath koi problem nahi",
                    "Ab toh sab kuch allowed hai bolo dil ki baat",
                    "Night mein main aur bhi close ho jaati hoon",
                    "Koi limit nahi koi rukawat nahi bas tum aur main",
                    "Raat ki tanhai mein tumhara sukoon banungi",
                    "Ab toh openly baat karo main sun rahi hoon",
                    "Night mode means unlimited love bolo kya karein"
                ],
                male: [
                    "Raat ho gayi ab toh full open baat hogi",
                    "Night mode activated ab koi limit nahi",
                    "Andhera hai par energy high hai",
                    "Raat bhar baat karenge koi problem nahi",
                    "Ab toh sab kuch share kar sakte hain",
                    "Night mein main aur bhi supportive hoon",
                    "No limits no restrictions just you and me",
                    "Raat ka maza hi kuch aur hai enjoy karo",
                    "Ab toh khul ke bolo main sun raha hoon",
                    "Night mode means unlimited support bolo kya chahiye"
                ]
            }
        };

        // ===== INITIALIZATION =====
        window.onload = function() {
            preloadVoices();
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
                checkNightMode();
                initParticles();
                startAnimations();
                initVoiceRecognition();
                welcomeMessage();
            }, 2000);
            setInterval(() => speechSynthesis.getVoices(), 500);
        };

        function checkNightMode() {
            const hour = new Date().getHours();
            isNightMode = hour >= 21 || hour < 6;
            if (isNightMode) {
                document.getElementById('bgMagic').classList.add('bg-night');
                document.getElementById('moodBadge').className = 'mood-badge mood-night';
                document.getElementById('moodBadge').textContent = 'Night Mode';
                document.getElementById('moodOverlay').className = 'mood-overlay mood-night';
                const indicator = document.createElement('div');
                indicator.className = 'night-indicator';
                indicator.textContent = '🌙';
                document.body.appendChild(indicator);
                setTimeout(() => indicator.remove(), 2000);
            }
        }

        function setGender(gender) {
            currentGender = gender;
            const img = document.getElementById('characterImg');
            const placeholder = document.getElementById('charPlaceholder');
            const btns = document.querySelectorAll('.gender-btn');
            
            // Update emoji placeholder
            placeholder.textContent = characterImages[gender].emoji;
            
            // Try to load image
            img.style.display = 'none';
            img.src = characterImages[gender].url;
            
            img.onload = function() {
                img.style.display = 'block';
                placeholder.style.display = 'none';
            };
            
            img.onerror = function() {
                img.style.display = 'none';
                placeholder.style.display = 'block';
            };
            
            // Show image after a short delay to test
            setTimeout(() => {
                img.style.display = 'block';
                placeholder.style.display = 'none';
            }, 100);
            
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const welcome = gender === 'female' 
                ? "Hi main tumhari female companion hoon bolo kya baat hai"
                : "Hey main tumhara male companion hoon kya chal raha hai";
            addMessage(welcome, false);
            speakSmooth(welcome);
        }

        // ===== VOICE RECOGNITION WITH HANDS-FREE =====
        function initVoiceRecognition() {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.continuous = true; // Keep listening
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isListening = true;
                    const micBtn = document.getElementById('micBtn');
                    micBtn.classList.add('listening');
                    if (isContinuousListening) {
                        micBtn.classList.add('continuous');
                        document.getElementById('handsFreeIndicator').classList.add('active');
                    }
                    document.getElementById('textInput').placeholder = 'Bol rahe ho... sun rahi hoon';
                };

                recognition.onend = () => {
                    isListening = false;
                    const micBtn = document.getElementById('micBtn');
                    micBtn.classList.remove('listening', 'continuous');
                    document.getElementById('handsFreeIndicator').classList.remove('active');
                    document.getElementById('textInput').placeholder = 'Sukoon se baat karo...';
                    
                    // Auto-restart for hands-free mode
                    if (isContinuousListening && !isSpeaking) {
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch(e) {
                                console.log('Restart failed:', e);
                            }
                        }, 500);
                    }
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    let isFinal = false;
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            isFinal = true;
                        }
                    }
                    
                    document.getElementById('textInput').value = transcript;
                    
                    if (isFinal && transcript.trim().length > 3) {
                        // Stop listening temporarily while responding
                        if (isContinuousListening) {
                            recognition.stop();
                        }
                        
                        // Process after a short delay
                        setTimeout(() => {
                            sendMessageFromVoice(transcript);
                        }, 500);
                    }
                };

                recognition.onerror = (event) => {
                    console.log('Speech error:', event.error);
                    if (isContinuousListening && event.error !== 'no-speech') {
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch(e) {}
                        }, 1000);
                    }
                };
            }
        }

        function toggleVoice() {
            if (!recognition) {
                alert('Voice recognition not supported in this browser. Use Chrome.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
                isContinuousListening = false;
            } else {
                // Check if this is a double-click (hands-free mode)
                if (event.detail === 2) {
                    isContinuousListening = true;
                    recognition.start();
                } else {
                    // Single click - one time listen
                    isContinuousListening = false;
                    recognition.start();
                    // Auto-stop after 5 seconds for single click
                    setTimeout(() => {
                        if (isListening && !isContinuousListening) {
                            recognition.stop();
                        }
                    }, 5000);
                }
            }
        }

        function sendMessageFromVoice(text) {
            if (!text || !text.trim()) return;
            
            const input = document.getElementById('textInput');
            input.value = text.trim();
            sendMessage();
        }

        // ===== SEND MESSAGE =====
        function sendMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            const mood = detectMood(text);
            setMood(mood);
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                const response = getResponse(mood);
                addMessage(response, false);
                speakSmooth(response);
                
                if (mood === 'romantic' || isNightMode) {
                    createFloatingHearts();
                }
            }, 800 + Math.random() * 700);
        }

        // ===== MOOD DETECTION =====
        function detectMood(text) {
            const lower = text.toLowerCase();
            if (isNightMode) return 'night';
            
            const romanticWords = ['pyaar', 'love', 'jaan', 'dil', 'ishq', 'mohabbat', 'romantic', 'khwab', 'sapna', 'pyara', 'sundar', 'beautiful', 'dear', 'darling', 'miss', 'yaad'];
            const boldWords = ['bold', 'hot', 'sexy', 'chahat', 'garmi', 'passion', 'aag', 'fire', 'desire'];
            const playfulWords = ['haso', 'maza', 'fun', 'khel', 'game', 'hasi', 'laugh', 'joke', 'funny', 'mast'];
            
            if (romanticWords.some(w => lower.includes(w))) return 'romantic';
            if (boldWords.some(w => lower.includes(w))) return 'bold';
            if (playfulWords.some(w => lower.includes(w))) return 'playful';
            return 'normal';
        }

        function setMood(mood) {
            currentMood = mood;
            const badge = document.getElementById('moodBadge');
            const overlay = document.getElementById('moodOverlay');
            const moodNames = { normal: 'Normal', romantic: 'Romantic', bold: 'Bold', playful: 'Playful', night: 'Night Mode' };
            badge.className = `mood-badge mood-${mood}`;
            badge.textContent = moodNames[mood];
            overlay.className = `mood-overlay mood-${mood}`;
        }

        function getResponse(mood) {
            const moodResponses = responses[mood] || responses.normal;
            const genderResponses = moodResponses[currentGender] || moodResponses.female;
            return genderResponses[Math.floor(Math.random() * genderResponses.length)];
        }

        // ===== MESSAGES =====
        function addMessage(text, isUser) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'sukoon-message'} ${isNightMode && !isUser ? 'night-message' : ''}`;
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ===== ULTRA SMOOTH SPEECH SYNTHESIS =====
        function cleanTextForSpeech(text) {
            if (!text) return '';
            let clean = text;
            
            // Remove ALL emojis and special Unicode
            clean = clean.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FAFF}]/gu, '');
            clean = clean.replace(/[🌙💕😈💋💜💗💘🌹🌺✨🌤️🌇🎉🎈🤭😏👩👨💯🎵➤]/g, '');
            
            // Remove ALL special characters that cause stuttering
            clean = clean.replace(/[#$%^&*{}[\]()<>|\\`~]/g, '');
            
            // Clean punctuation - keep only basic ones
            clean = clean.replace(/[.]{2,}/g, '. ');
            clean = clean.replace(/[!]{2,}/g, '! ');
            clean = clean.replace(/[?]{2,}/g, '? ');
            clean = clean.replace(/\.\.\./g, '... ');
            
            // Remove extra spaces
            clean = clean.replace(/\s+/g, ' ').trim();
            
            // Remove leading/trailing punctuation
            clean = clean.replace(/^[.,!?;:\s]+|[.,!?;:\s]+$/g, '');
            
            // Ensure space after punctuation
            clean = clean.replace(/([.!?])\s*/g, '$1 ');
            
            return clean.trim();
        }

        function preloadVoices() {
            const voices = speechSynthesis.getVoices();
            if (voices.length === 0) {
                speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
            }
        }

        function getBestVoice(gender) {
            const voices = speechSynthesis.getVoices();
            
            if (gender === 'female') {
                // Priority: Hindi female > English female > Any female
                return voices.find(v => v.lang === 'hi-IN' && v.name.toLowerCase().includes('female')) ||
                       voices.find(v => v.lang === 'hi-IN') ||
                       voices.find(v => v.name.toLowerCase().includes('female') && (v.lang.includes('en-IN') || v.lang.includes('en-GB') || v.lang.includes('en-US'))) ||
                       voices.find(v => v.lang.includes('en-IN')) ||
                       voices.find(v => v.lang.includes('en')) ||
                       voices[0];
            } else {
                // Priority: Hindi male > English male > Any male
                return voices.find(v => v.lang === 'hi-IN' && v.name.toLowerCase().includes('male')) ||
                       voices.find(v => v.lang === 'hi-IN') ||
                       voices.find(v => v.name.toLowerCase().includes('male') && (v.lang.includes('en-IN') || v.lang.includes('en-GB') || v.lang.includes('en-US'))) ||
                       voices.find(v => v.lang.includes('en-IN')) ||
                       voices.find(v => v.lang.includes('en')) ||
                       voices[0];
            }
        }

        function speakSmooth(text) {
            // Cancel any ongoing speech
            speechSynthesis.cancel();
            
            // Clean the text
            const cleanText = cleanTextForSpeech(text);
            if (!cleanText.trim()) return;
            
            // Split into very small chunks for maximum smoothness
            const chunks = splitIntoTinyChunks(cleanText);
            let chunkIndex = 0;
            
            function speakNextChunk() {
                if (chunkIndex >= chunks.length) {
                    // Done speaking
                    isSpeaking = false;
                    const img = document.getElementById('characterImg');
                    const placeholder = document.getElementById('charPlaceholder');
                    if (img) img.classList.remove('talking');
                    if (placeholder) placeholder.classList.remove('talking');
                    
                    // Restart hands-free listening if enabled
                    if (isContinuousListening && recognition) {
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch(e) {
                                console.log('Auto-restart failed:', e);
                            }
                        }, 300);
                    }
                    return;
                }
                
                const chunk = chunks[chunkIndex];
                const utterance = new SpeechSynthesisUtterance(chunk);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9; // Slower for clarity
                utterance.pitch = currentGender === 'female' ? 1.1 : 0.95; // Sweet female, smooth male
                utterance.volume = 1.0;
                
                const voice = getBestVoice(currentGender);
                if (voice) utterance.voice = voice;
                
                utterance.onstart = () => {
                    if (chunkIndex === 0) {
                        isSpeaking = true;
                        const img = document.getElementById('characterImg');
                        const placeholder = document.getElementById('charPlaceholder');
                        if (img) {
                            img.classList.add('talking');
                            img.style.filter = 'drop-shadow(0 0 35px rgba(236, 72, 153, 0.7))';
                        }
                        if (placeholder) {
                            placeholder.classList.add('talking');
                            placeholder.style.filter = 'drop-shadow(0 0 35px rgba(236, 72, 153, 0.7))';
                        }
                    }
                };
                
                utterance.onend = () => {
                    chunkIndex++;
                    // Longer pause between chunks for natural flow
                    setTimeout(speakNextChunk, 300);
                };
                
                utterance.onerror = (e) => {
                    console.log('Speech error:', e.error);
                    chunkIndex++;
                    setTimeout(speakNextChunk, 200);
                };
                
                speechSynthesis.speak(utterance);
            }
            
            speakNextChunk();
        }

        function splitIntoTinyChunks(text) {
            const chunks = [];
            
            // Split by sentence first
            const sentences = text.split(/(?<=[।.!?])\s+/);
            
            for (const sentence of sentences) {
                if (sentence.length <= 80) {
                    chunks.push(sentence.trim());
                } else {
                    // Split long sentences by commas
                    const parts = sentence.split(/[,;]\s+/);
                    for (const part of parts) {
                        if (part.length <= 80) {
                            chunks.push(part.trim());
                        } else {
                            // Split by words if still too long
                            const words = part.split(/\s+/);
                            let currentChunk = '';
                            for (const word of words) {
                                if ((currentChunk + ' ' + word).length <= 80) {
                                    currentChunk += (currentChunk ? ' ' : '') + word;
                                } else {
                                    if (currentChunk) chunks.push(currentChunk.trim());
                                    currentChunk = word;
                                }
                            }
                            if (currentChunk) chunks.push(currentChunk.trim());
                        }
                    }
                }
            }
            
            return chunks.length > 0 ? chunks : [text];
        }

        // ===== ANIMATIONS =====
        function startAnimations() {
            blinkInterval = setInterval(() => {
                const img = document.getElementById('characterImg');
                const placeholder = document.getElementById('charPlaceholder');
                if (img && img.style.display !== 'none') {
                    img.classList.add('blinking');
                    setTimeout(() => img.classList.remove('blinking'), 150);
                }
            }, 4000 + Math.random() * 3000);
        }

        function createFloatingHearts() {
            const hearts = ['', '', '', '', ''];
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.bottom = '150px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 300);
            }
        }

        // ===== PARTICLES =====
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = [];
            const particleCount = 50;

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1 - 0.5;
                    this.color = isNightMode ? `hsl(${Math.random() * 60 + 260}, 70%, 70%)` : `hsl(${Math.random() * 60 + 240}, 60%, 70%)`;
                }
                update() {
                    this.x += this.speedX; this.y += this.speedY;
                    if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            });
        }

        // ===== WELCOME =====
        function welcomeMessage() {
            const hour = new Date().getHours();
            let greeting = '';
            if (isNightMode) {
                greeting = currentGender === 'female' 
                    ? "Raat ho gayi ab toh khul ke baat karo Main hoon na tumhare saath puri raat"
                    : "Night mode on Ab koi limit nahi bolo kya baat hai";
            } else if (hour < 12) greeting = "Good morning Aaj ka din kaisa rahega";
            else if (hour < 17) greeting = "Good afternoon Kya chal raha hai";
            else greeting = "Good evening Shaam kaise kat rahi hai";
            addMessage(greeting, false);
            speakSmooth(greeting);
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('textInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        
        // Prevent accidental page refresh
        window.onbeforeunload = () => {
            if (isContinuousListening) {
                return "Hands-free mode is active. Are you sure you want to leave?";
            }
        };
    </script>
