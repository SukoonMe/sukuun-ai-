<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; }
        #app { width: 100%; max-width: 400px; height: 100vh; margin: auto; display: flex; flex-direction: column; }
        #sukuun-img { flex: 1; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all 0.5s ease; }
        .breathing { animation: float 4s ease-in-out infinite, breathe 3s ease-in-out infinite; }
        .talking { animation: speak-glow 0.2s ease-in-out infinite alternate; transform: scale(1.05); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes speak-glow { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img" class="breathing"></div>
        <div class="h-1/3 bg-black/80 backdrop-blur-xl p-6 border-t border-white/10">
            <div id="messages" class="h-20 overflow-y-auto mb-4 text-sm text-gray-300"></div>
            <div class="flex gap-2">
                <input type="text" id="userInput" class="flex-1 bg-white/5 p-4 rounded-xl border border-white/10 outline-none" placeholder="Sukoon se baat karo...">
                <button id="micBtn" class="bg-indigo-600 p-4 rounded-xl">🎤</button>
            </div>
        </div>
    </div>

    <script>
        const img = document.getElementById('sukuun-img');
        img.style.backgroundImage = "url('/best.png')";

        // 1. VOICE RECOGNITION (MIKE)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        document.getElementById('micBtn').onclick = () => recognition.start();
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            send(transcript);
        };

        // 2. SEND LOGIC
        async function send(message = null) {
            const input = document.getElementById('userInput');
            const text = message || input.value;
            if(!text.trim()) return;
            input.value = '';

            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: text, userId: localStorage.getItem('userId') || '1' }) });
            const data = await res.json();
            
            // 3. SMOOTH VOICE
            const speech = new SpeechSynthesisUtterance(data.reply.replace(/[*#]/g, ""));
            const voices = window.speechSynthesis.getVoices();
            speech.voice = voices.find(v => v.lang === 'hi-IN') || voices[0];
            speech.rate = 0.92;
            
            speech.onstart = () => img.className = 'talking';
            speech.onend = () => img.className = 'breathing';
            window.speechSynthesis.speak(speech);
        }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
