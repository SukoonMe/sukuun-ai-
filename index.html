<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; }
        #app { width: 100%; max-width: 400px; height: 100vh; margin: auto; display: flex; flex-direction: column; }
        
        /* Smooth Breathing Animation - Koi vibration nahi, sirf soft movement */
        #sukuun-img { 
            flex: 1; background-size: contain; background-repeat: no-repeat; background-position: center;
            transition: all 0.8s ease-in-out;
            transform: scale(1);
        }
        .breathing { animation: breathe 4s ease-in-out infinite; }
        .talking { animation: speak-glow 0.4s ease-in-out infinite alternate; transform: scale(1.05); }
        
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes speak-glow { 0% { filter: brightness(1); } 100% { filter: brightness(1.2); } }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img" class="breathing"></div>
        <div class="h-1/3 bg-black/80 backdrop-blur-lg p-6 border-t border-white/10">
            <div id="messages" class="h-24 overflow-y-auto mb-4 text-sm text-gray-300"></div>
            <input type="text" id="userInput" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none" placeholder="Sukoon se baat karo...">
        </div>
    </div>

    <script>
        const img = document.getElementById('sukuun-img');
        img.style.backgroundImage = "url('/best.png')";

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            const text = input.value; input.value = '';

            // AI Response
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: text, userId: localStorage.getItem('userId') || '1' }) });
            const data = await res.json();
            document.getElementById('messages').innerHTML += `<div class="mb-2">Sukoon: ${data.reply}</div>`;
            
            // SMOOTH VOICE LOGIC
            const speech = new SpeechSynthesisUtterance(data.reply.replace(/[*#]/g, ""));
            speech.lang = 'hi-IN';
            speech.rate = 0.9; // Normal pace
            speech.pitch = 1.0; 
            
            // Smooth Animation Sync
            speech.onstart = () => { img.className = 'talking'; };
            speech.onend = () => { img.className = 'breathing'; };
            
            window.speechSynthesis.speak(speech);
        }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
