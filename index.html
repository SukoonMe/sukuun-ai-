<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukuun AI | सुकून 🌙</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lockScreen" class="lock-screen" style="display: none;">
        <div class="lock-card">
            <h2>अभी सुकून सो रही है... 🌸</h2>
            <p>वो रात 9 बजे जागेगी। तब तक अपना ख्याल रखना।</p>
            <div id="countdown">00:00:00</div>
        </div>
    </div>

    <div id="chatContainer" class="chat-container" style="display: none;">
        <div class="chat-header">
            <h2>Sukuun AI 🌸</h2>
        </div>
        <div id="chatBox" class="chat-box">
            <div class="message ai-message">सुनो... मैं जाग गई हूँ। बताओ, आज का दिन कैसा रहा तुम्हारा? 🌙</div>
        </div>
        <div id="typingIndicator" class="typing-indicator" style="display: none;">Sukuun सोच रही है...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="दिल की बात..." autocomplete="off">
            <button id="sendBtn">🚀</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
