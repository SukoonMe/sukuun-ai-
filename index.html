<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sukuun AI 🌙</title>
    <style>
        body { margin:0; background: #0c0f1d; color: white; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { width: 90%; max-width: 400px; height: 90vh; background: #1e293b; border-radius: 30px; border: 2px solid #4f46e5; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Full Portrait View setup */
        #sukuun-img { 
            height: 55vh; 
            background-size: cover; 
            background-position: center top; 
            background-repeat: no-repeat;
            transition: 0.5s; 
            border-bottom: 2px solid #4f46e5;
        }
        .speaking { filter: brightness(1.3); transform: scale(1.02); }
        
        #messages { flex: 1; padding: 15px; overflow-y: auto; }
        .msg { margin: 10px 0; padding: 12px; border-radius: 15px; max-width: 85%; }
        .ai { background: #334155; }
        .user { background: #4f46e5; align-self: flex-end; margin-left: auto; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img" style="background-image: url('/best.png');"></div>
        <div id="messages"></div>
        <div class="input-area">
            <button onclick="startListening()">🎤</button>
            <input type="text" id="userInput" placeholder="Dil ki baat kaho...">
            <button onclick="send()">Bejo</button>
        </div>
    </div>

    <script>
        const userProfile = { name: 'Yaar', gender: 'male' }; 
        const img = document.getElementById('sukuun-img');

        // Mic Functionality
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'hi-IN';
            recognition.start();
            recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                send();
            };
        }

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;

            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div class="msg user">${input.value}</div>`;
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, userProfile })
            });
            const data = await res.json();
            
            // Image Switch Logic
            img.style.backgroundImage = data.avatarType === 'female' ? "url('/best.png')" : "url('/male.png')";
            
            // AI Response with clean text (Removing emojis from speech)
            const cleanReply = data.reply.replace(/[\u{1F300}-\u{1F64F}\u{1F680}-\u{1F6FF}]/gu, '');
            msgDiv.innerHTML += `<div class="msg ai">${data.reply}</div>`;
            
            const speech = new SpeechSynthesisUtterance(cleanReply);
            speech.lang = 'hi-IN';
            img.classList.add('speaking');
            speech.onend = () => img.classList.remove('speaking');
            window.speechSynthesis.speak(speech);
            
            input.value = '';
        }
    </script>
</body>
</html>
