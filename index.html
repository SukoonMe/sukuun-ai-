<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #characterImg { transition: opacity 0.5s ease; }
        .mic-active { background: #10b981 !important; box-shadow: 0 0 20px #10b981; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <img id="characterImg" src="https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/best.png" 
         class="w-[300px] h-[400px] object-cover rounded-3xl shadow-2xl mb-10">

    <div class="fixed bottom-10 w-full px-6 max-w-md">
        <div class="flex items-center gap-4 bg-white/10 backdrop-blur-lg p-3 rounded-full border border-white/10">
            <input type="text" id="userInput" class="flex-1 bg-transparent outline-none px-4" placeholder="Dil ki baat kaho...">
            <button id="micBtn" onclick="toggleHandsFree()" class="w-16 h-16 rounded-full bg-purple-600 flex items-center justify-center text-3xl">🎤</button>
        </div>
    </div>

    <script>
        const assets = {
            normal: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/best.png',
            romantic: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/romantic.png',
            spicy: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/spicy.png'
        };

        let isHandsFree = false;

        // 1. Pro Voice Engine (Stops Blah Blah & Cracking)
        function sukoonSpeak(text, mood) {
            window.speechSynthesis.cancel();
            
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'hi-IN';
            utter.pitch = 1.1; // Deep, calm voice
            utter.rate = 0.85; // Slow, natural pace

            // Correct voice selection for Hindi
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                utter.voice = voices.find(v => v.lang === 'hi-IN') || voices[0];
            };

            // Image Update
            document.getElementById('characterImg').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('characterImg').src = assets[mood] || assets.normal;
                document.getElementById('characterImg').style.opacity = 1;
            }, 300);

            window.speechSynthesis.speak(utter);
        }

        // 2. Stable Hands-Free Toggle
        function toggleHandsFree() {
            isHandsFree = !isHandsFree;
            const btn = document.getElementById('micBtn');
            btn.classList.toggle('mic-active');
            
            if(isHandsFree) {
                sukoonSpeak("Main sun rahi hoon, kaho.", "romantic");
            }
        }

        // 3. Command Handler
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const val = e.target.value.toLowerCase();
                if(val.includes('garam')) sukoonSpeak("Tumhari baatein...", "spicy");
                else if(val.includes('pyar')) sukoonSpeak("Main tumhare saath hoon.", "romantic");
                else sukoonSpeak("Ji, aur batao.", "normal");
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
