<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sukuun AI 🌙</title>
    <style>
        body { margin:0; background: #0c0f1d; color: white; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { width: 90%; max-width: 400px; height: 85vh; background: #1e293b; border-radius: 30px; border: 2px solid #4f46e5; display: flex; flex-direction: column; overflow: hidden; }
        #sukuun-img { height: 180px; background: url('https://i.ibb.co/sukuun-avatar.jpg') center/cover; transition: 0.5s; }
        .speaking { filter: brightness(1.3); transform: scale(1.02); }
        #messages { flex: 1; padding: 15px; overflow-y: auto; }
        .msg { margin: 10px 0; padding: 12px; border-radius: 15px; max-width: 85%; }
        .ai { background: #334155; align-self: flex-start; }
        .user { background: #4f46e5; align-self: flex-end; margin-left: auto; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img"></div>
        <div id="messages"></div>
        <div class="input-area">
            <button onclick="startListening()">🎤</button>
            <input type="text" id="userInput" placeholder="दिल की बात...">
            <button onclick="send()">भेजो</button>
        </div>
    </div>

    <script>
        const img = document.getElementById('sukuun-img');
        async function send() {
            const input = document.getElementById('userInput');
            const msgBox = document.getElementById('messages');
            if(!input.value.trim()) return;
            msgBox.innerHTML += `<div class="msg user">${input.value}</div>`;
            const userText = input.value; input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: userText, userProfile: {name: 'yaar'} })
            });
            const data = await res.json();
            
            // Vocal Interaction
            img.classList.add('speaking');
            const speech = new SpeechSynthesisUtterance(data.reply);
            speech.lang = 'hi-IN';
            speech.onend = () => img.classList.remove('speaking');
            window.speechSynthesis.speak(speech);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai';
            msgBox.appendChild(aiDiv);
            let i = 0;
            function type() { if(i < data.reply.length) { aiDiv.innerText += data.reply.charAt(i); i++; setTimeout(type, 40); } }
            type();
        }

        function startListening() {
            const rec = new (window.webkitSpeechRecognition)();
            rec.lang = 'hi-IN';
            rec.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; send(); };
            rec.start();
        }
    </script>
</body>
</html>
