<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukuun AI | सुकून 🌙</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="night-mode">
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <h2>Sukuun AI 🌸</h2>
                <div class="status-container">
                    <span class="status-dot"></span>
                    <small id="statusText">पास बैठी हूँ | Soft Voice Enabled</small>
                </div>
            </div>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">सुनो... मैं यहीं हूँ, तुम्हारे बिल्कुल पास। आज तुम्हारा दिन कैसा रहा? 🌙</div>
        </div>

        <div class="typing-indicator" id="typingIndicator">Sukuun सोच रही है...</div>

        <div class="input-area">
            <button id="micBtn" class="icon-btn" title="बोलकर बात करें">🎙️</button>
            <input type="text" id="userInput" placeholder="दिल की बात लिखो या बोलो..." autocomplete="off">
            <button id="sendBtn" class="send-btn">🚀</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
