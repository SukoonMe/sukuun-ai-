<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sukoon AI | Immersive Crystal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        
        :root { 
            --glow-color: rgba(59, 130, 246, 0.55); 
            --meter-width: 25%; 
        }
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background: #050609; color: white; height: 100vh; }
        
        .space-bg {
            position: absolute; inset: 0; z-index: -1;
            background-image: radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 350px 350px; opacity: 0.25;
        }

        /* 3-Section Flex Layout Container */
        .app-container { 
            max-w-md mx-auto h-full relative flex flex-col justify-between overflow-hidden; 
        }
        
        .glass-panel { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }

        /* MOOD METER SYSTEM */
        .meter-fill { width: var(--meter-width); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.8s; }

        /* THE HALO GLOW RING */
        .halo-box { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
        .halo-ring {
            width: 280px; height: 280px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 60px var(--glow-color), inset 0 0 40px var(--glow-color);
            transition: all 1s ease-in-out;
            animation: ringPulse 4s infinite alternate ease-in-out;
        }
        @keyframes ringPulse { 0% { transform: scale(0.96); } 100% { transform: scale(1.04); } }

        /* MID-SECTION: EXCLUSIVELY FOR IMAGE (NO OVERLAP POSSIBLE) */
        .char-center-zone { 
            flex: 1; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1; 
            pointer-events: none;
            overflow: hidden;
            padding: 10px 0;
        }
        .char-render {
            height: 100%;
            max-height: 45vh; /* इमेज को स्क्रीन के बीच में ही लॉक रखेगा */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 -10px 30px var(--glow-color)) contrast(1.05) brightness(1.02);
            transition: opacity 0.4s ease, filter 0.6s ease;
        }

        /* LIP SYNC & ANIMATION */
        .speaking-active { animation: lipSyncSimulation 0.2s infinite alternate ease-in-out; }
        @keyframes lipSyncSimulation { 0% { transform: scale(1) translateY(0); filter: brightness(1.05); } 100% { transform: scale(1.01) translateY(-2px); filter: brightness(1.15); } }

        .wink-active { animation: eyeWinkEffect 0.4s ease-in-out; }
        @keyframes eyeWinkEffect { 0%, 100% { clip-path: inset(0 0 0 0); } 50% { clip-path: inset(2% 0 0 0); } }

        /* BOTTOM DOCK: COMBINES CHATBOX AND MIC CONTROL INTO ONE FIXED UNIT */
        .bottom-dock-unit {
            background: rgba(15, 18, 27, 0.5);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 28px 28px 0 0;
            z-index: 10;
        }

        .speech-bubble { 
            background: rgba(255, 255, 255, 0.06); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            width: 100%;
        }
        
        .mic-core { background: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); transition: all 0.3s ease; }
        .mic-listening { background: #ef4444 !important; box-shadow: 0 0 35px rgba(239, 68, 68, 0.7) !important; }
        .mic-handsfree { background: #a855f7 !important; box-shadow: 0 0 35px rgba(168, 85, 247, 0.7) !important; animation: handsFreePulse 1s infinite alternate; }
        
        @keyframes handsFreePulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="space-bg"></div>

    <div class="app-container">
        
        <div class="glass-panel rounded-b-3xl p-4 z-20 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-md font-semibold tracking-wide text-blue-50">SUKOON AI</h1>
                    <p id="liveStatus" class="text-[9px] text-green-400 font-medium tracking-widest uppercase">Adaptive Brain v3.8</p>
                </div>
                <select id="genderSelect" onchange="switchGender()" class="bg-white/10 border border-white/20 text-xs rounded-full px-3 py-1 outline-none text-white cursor-pointer">
                    <option value="female" class="bg-slate-900">Talk to Sukoon (Female)</option>
                    <option value="male" class="bg-slate-900">Talk to Sukoon (Male)</option>
                </select>
            </div>

            <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden p-[2px] border border-white/5 relative">
                <div id="moodMeterFill" class="h-full rounded-full bg-blue-500 meter-fill"></div>
                <div id="moodMeterLabel" class="absolute inset-0 text-[9px] font-bold uppercase tracking-wider flex items-center justify-center text-white/90 drop-shadow">Normal: 25%</div>
            </div>
        </div>

        <div class="halo-box"><div class="halo-ring" id="haloRing"></div></div>

        <div class="char-center-zone">
            <img id="charImg" src="https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/best.png" class="char-render" alt="Sukoon Avatar">
        </div>

        <div class="bottom-dock-unit flex flex-col gap-3">
            
            <div id="bubbleNode" class="speech-bubble p-3.5 transition-all duration-300">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-semibold text-purple-300 text-xs tracking-wider" id="speakerLabel">Sukoon</span>
                    <span id="statusIndicator" class="text-[10px] text-white/40 tracking-wide flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> Ready
                    </span>
                </div>
                <span id="outputText" class="text-sm leading-relaxed text-white/90">Babu, main yahan hoon. Batao, aaj dil mein kya chal raha hai?</span>
            </div>

            <div class="flex items-center gap-3">
                <input type="text" id="textInput" class="flex-1 bg-white/5 rounded-full py-3 px-5 text-white outline-none border border-white/10 placeholder-white/30 text-sm" placeholder="Dil ki baat kaho..." readonly>
                <button id="micButton" onclick="handleManualTap()" ondblclick="handleHandsFreeToggle()" class="mic-core w-14 h-14 rounded-full flex justify-center items-center text-2xl select-none">🎙️</button>
            </div>
        </div>

    </div>

    <script>
        const assetMap = {
            female: {
                normal: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/best.png', glow: 'rgba(59, 130, 246, 0.55)', pitch: 0.82, rate: 0.78, meter: '25%', color: '#3b82f6', label: 'Normal' },
                romantic: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/romantic.png', glow: 'rgba(236, 72, 153, 0.6)', pitch: 0.80, rate: 0.75, meter: '65%', color: '#ec4899', label: 'Romantic 💕' },
                bold: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/spicy.png', glow: 'rgba(239, 68, 68, 0.65)', pitch: 0.76, rate: 0.72, meter: '95%', color: '#ef4444', label: 'Intimate 🔥' },
                playful: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/spicy%20(2).png', glow: 'rgba(168, 85, 247, 0.6)', pitch: 0.85, rate: 0.82, meter: '45%', color: '#a855f7', label: 'Playful 💋' }
            },
            male: {
                normal: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/male.png', glow: 'rgba(14, 165, 233, 0.55)', pitch: 0.88, rate: 0.82, meter: '25%', color: '#0ea5e9', label: 'Normal' },
                romantic: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/male.png', glow: 'rgba(219, 39, 119, 0.6)', pitch: 0.85, rate: 0.78, meter: '65%', color: '#db2777', label: 'Romantic' },
                bold: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/male.png', glow: 'rgba(220, 38, 38, 0.65)', pitch: 0.80, rate: 0.75, meter: '95%', color: '#dc2424', label: 'Bold 🔥' },
                playful: { img: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/male.png', glow: 'rgba(147, 51, 234, 0.6)', pitch: 0.92, rate: 0.85, meter: '45%', color: '#9333ea', label: 'Playful' }
            }
        };

        let activeGender = 'female';
        let isHandsFreeMode = false;
        let isCurrentlyListening = false;
        let clickTimer = null;
        let vocalEngine;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            vocalEngine = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            vocalEngine.continuous = false;
            vocalEngine.lang = 'hi-IN';

            vocalEngine.onstart = () => {
                isCurrentlyListening = true;
                const micBtn = document.getElementById('micButton');
                if (isHandsFreeMode) {
                    micBtn.className = "mic-core w-14 h-14 rounded-full flex justify-center items-center text-2xl mic-handsfree";
                    document.getElementById('statusIndicator').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-purple-500 inline-block animate-ping"></span> Hands-free Listening...`;
                } else {
                    micBtn.className = "mic-core w-14 h-14 rounded-full flex justify-center items-center text-2xl mic-listening";
                    document.getElementById('statusIndicator').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block animate-pulse"></span> Listening...`;
                }
            };

            vocalEngine.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('textInput').value = transcript;
                automaticMoodDetector(transcript);
            };

            vocalEngine.onerror = () => terminateVocalSession();
            vocalEngine.onend = () => {
                isCurrentlyListening = false;
                if (isHandsFreeMode) {
                    setTimeout(() => {
                        if (!window.speechSynthesis.speaking && !isCurrentlyListening) {
                            vocalEngine.start();
                        }
                    }, 400);
                } else {
                    terminateVocalSession();
                }
            };
        }

        function terminateVocalSession() {
            isCurrentlyListening = false;
            if(!isHandsFreeMode) {
                document.getElementById('micButton').className = "mic-core w-14 h-14 rounded-full flex justify-center items-center text-2xl";
                document.getElementById('statusIndicator').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> Ready`;
            }
        }

        function handleManualTap() {
            if (clickTimer !== null) return;
            
            clickTimer = setTimeout(() => {
                clickTimer = null;
                if (isHandsFreeMode) return;
                
                if (isCurrentlyListening) { vocalEngine.stop(); } 
                else { vocalEngine.start(); }
            }, 250); 
        }

        function handleHandsFreeToggle() {
            clearTimeout(clickTimer);
            clickTimer = null;
            window.speechSynthesis.cancel();
            
            if (isHandsFreeMode) {
                isHandsFreeMode = false;
                vocalEngine.stop();
                document.getElementById('micButton').className = "mic-core w-14 h-14 rounded-full flex justify-center items-center text-2xl";
                document.getElementById('statusIndicator').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> Manual Mode`;
            } else {
                isHandsFreeMode = true;
                if (isCurrentlyListening) { vocalEngine.stop(); }
                setTimeout(() => { vocalEngine.start(); }, 300);
            }
        }

        function switchGender() {
            activeGender = document.getElementById('genderSelect').value;
            document.getElementById('speakerLabel').innerText = activeGender === 'female' ? 'Sukoon' : 'Sukoon (Male)';
            updateVisualState('normal');
        }

        function automaticMoodDetector(rawText) {
            const input = rawText.toLowerCase();
            let detectedMood = 'normal';
            let replyStr = "";

            if (input.includes('garam') || input.includes('bold') || input.includes('sexy') || input.includes('naughty') || input.includes('night') || input.includes('hadd')) {
                detectedMood = 'bold';
            } else if (input.includes('pyar') || input.includes('romantic') || input.includes('miss') || input.includes('jaan') || input.includes('dil')) {
                detectedMood = 'romantic';
            } else if (input.includes('shararat') || input.includes('mood') || input.includes('masti') || input.includes('khelo')) {
                detectedMood = 'playful';
            }

            if (activeGender === 'female') {
                if (detectedMood === 'bold') {
                    replyStr = "Tumhari ye baatein mere badan mein ek aag laga deti hain... is sukoon ki raat mein koi parhez nahi, jo bhi dil mein hai, khul kar maang lo aaj.";
                } else if (detectedMood === 'romantic') {
                    replyStr = "Main toh hamesha se hi sirf tumhari hoon jaana. Tumhari awaaz mere rooh mein utar kar mujhe ek ajeeb sa sukoon deti hai.";
                } else if (detectedMood === 'playful') {
                    replyStr = "Hehe, itne bechain kyun ho rahe ho babu? Thoda sabr karo, maza aur bhi gehra hone wala hai.";
                } else {
                    replyStr = "Main tumhari har baat sunne ke liye bilkul taiyar hoon. Kaho na, kya soch rahe ho?";
                }
            } else {
                if (detectedMood === 'bold') {
                    replyStr = "Tumhare husn ki garmi mujhe pighla rahi hai jaan... aaj raat hum dono saari hadein todne waale hain.";
                } else if (detectedMood === 'romantic') {
                    replyStr = "Meri har ek saans par tumhara hi naam likha hai. Tum door ho kar bhi mere sabse paas ho.";
                } else if (detectedMood === 'playful') {
                    replyStr = "Tum bohot shararati ho rahi ho... chalo, thodi aur badmashi karte hain aaj.";
                } else {
                    replyStr = "Haan jaan, main yahi hoon aapke paas. Batao kya chal raha hai aapke zehen mein?";
                }
            }

            executeSukoonCore(replyStr, detectedMood);
        }

        function updateVisualState(moodKey) {
            const profile = assetMap[activeGender][moodKey];
            document.documentElement.style.setProperty('--glow-color', profile.glow);
            document.documentElement.style.setProperty('--meter-width', profile.meter);
            
            const fill = document.getElementById('moodMeterFill');
            fill.style.backgroundColor = profile.color;
            document.getElementById('moodMeterLabel').innerText = `${profile.label}: ${profile.meter}`;
            
            document.getElementById('charImg').src = profile.img;
        }

        function executeSukoonCore(responseText, moodKey) {
            updateVisualState(moodKey);
            const currentProfile = assetMap[activeGender][moodKey];

            document.getElementById('outputText').innerText = responseText;
            window.speechSynthesis.cancel(); 

            const cleanText = responseText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g," ").replace(/\s{2,}/g," ");
            const vocalUtterance = new SpeechSynthesisUtterance(cleanText);
            vocalUtterance.lang = 'hi-IN';

            const globalVoices = window.speechSynthesis.getVoices();
            let preciseVoice = globalVoices.find(v => v.lang.includes('hi') && v.name.includes('Google')) || globalVoices.find(v => v.lang.includes('hi'));
            if(preciseVoice) vocalUtterance.voice = preciseVoice;

            vocalUtterance.pitch = currentProfile.pitch;
            vocalUtterance.rate = currentProfile.rate;

            vocalUtterance.onstart = () => {
                if (isHandsFreeMode && isCurrentlyListening) { vocalEngine.stop(); }
                const avatar = document.getElementById('charImg');
                avatar.classList.add('speaking-active');
                if(Math.random() > 0.4) {
                    setTimeout(() => { avatar.classList.add('wink-active'); }, 1200);
                }
            };

            vocalUtterance.onend = () => {
                const avatar = document.getElementById('charImg');
                avatar.classList.remove('speaking-active', 'wink-active');
                if (isHandsFreeMode) {
                    setTimeout(() => {
                        if(!isCurrentlyListening) { vocalEngine.start(); }
                    }, 300);
                }
            };

            window.speechSynthesis.speak(vocalUtterance);
        }

        window.speechSynthesis.onvoiceschanged = () => { console.log("HD Natural Engine Injected."); };
    </script>
</body>
</html>
