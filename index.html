<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukuun AI | सुकून 🌙</title>
    <style>
        body { margin: 0; background: #0c0f1d; color: white; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #chatBox { width: 90%; max-width: 450px; height: 80vh; background: #1e293b; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; padding: 20px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 10px; }
        .ai { background: #334155; align-self: flex-start; }
        .user { background: #4f46e5; align-self: flex-end; }
        input { padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div id="chatBox">
        <div id="messages" style="flex:1; overflow-y:auto;">
            <div class="msg ai">सुनो... मैं जाग गई हूँ। बताओ कैसा रहा दिन? 🌙</div>
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="userInput" style="flex:1;" placeholder="कुछ कहो...">
            <button onclick="send()">भेजो</button>
        </div>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('userInput');
            const msgs = document.getElementById('messages');
            const text = input.value;
            if(!text) return;
            
            msgs.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            msgs.innerHTML += `<div class="msg ai">${data.reply || 'कुछ एरर आया है'}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
