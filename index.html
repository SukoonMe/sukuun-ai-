        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; overflow: hidden; height: 100vh; }
        .bg-magic { position: fixed; inset: 0; z-index: -2; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); transition: background 2s ease; }
        .bg-night { background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #0f0518 100%); }
        #particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        
        .character-container {
            position: absolute; top: 2%; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 480px; height: 62vh; z-index: 10;
            border-radius: 30px; overflow: hidden;
            box-shadow: 0 0 80px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            display: flex; align-items: center; justify-content: center;
        }
        .character-img {
            width: 100%; height: 100%; object-fit: cover; object-position: center top;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.02) translateY(-6px); } }
        .character-img.talking { animation: talkPulse 0.7s ease-in-out infinite; }
        @keyframes talkPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        
        #messages {
            position: absolute; bottom: 190px; left: 0; width: 100%; height: 26vh;
            overflow-y: auto; padding: 1rem; display: flex; flex-direction: column;
            gap: 0.75rem; z-index: 20; scrollbar-width: none;
        }
        #messages::-webkit-scrollbar { display: none; }
        .message {
            max-width: 85%; padding: 1rem 1.25rem; border-radius: 1.5rem;
            font-size: 0.95rem; line-height: 1.6; animation: slideUp 0.4s ease;
            backdrop-filter: blur(15px); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .sukoon-message { align-self: flex-start; background: rgba(255, 255, 255, 0.15); color: #f3e8ff; }
        .night-message { background: linear-gradient(135deg, rgba(139, 92, 246, 0.85), rgba(236, 72, 153, 0.75)); color: #fff; }
        
        .input-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 1.25rem; padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.7) 70%, transparent 100%); z-index: 30;
        }
        .input-wrapper {
            display: flex; gap: 0.75rem; align-items: center;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2.5rem; padding: 0.75rem 1.25rem; backdrop-filter: blur(20px);
        }
        .text-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; }
        .text-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .icon-btn {
            width: 3.25rem; height: 3.25rem; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.2); color: #fff; transition: all 0.3s ease;
        }
        .icon-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.3); }
        .send-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
        .mic-btn.listening { background: linear-gradient(135deg, #ef4444, #dc2626); animation: pulseRed 1.5s infinite; }
        .mic-btn.continuous { background: linear-gradient(135deg, #10b981, #059669); animation: pulseGreen 2s infinite; }
        @keyframes pulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 50% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } }
        @keyframes pulseGreen { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); } 50% { box-shadow: 0 0 0 25px rgba(16,185,129,0); } }
        
        .mood-badge {
            position: absolute; top: 1.25rem; right: 1.25rem;
            padding: 0.5rem 1.25rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 600;

        @keyframes glow { 0%, 100% { box-shadow: 0 0 15px rgba(236,72,153,0.6); } 50% { box-shadow: 0 0 30px rgba(236,72,153,1); } }
        
        .gender-selector { position: absolute; top: 1.25rem; left: 1.25rem; display: flex; gap: 0.5rem; z-index: 40; }
        .gender-btn {
            padding: 0.5rem 1.25rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; backdrop-filter: blur(10px);
        }
        .gender-btn.active { background: linear-gradient(135deg, #8b5cf6, #ec4899); }

            position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(5,150,105,0.95));

        // ===== TEXT PROCESSOR (Clean, Stretch, Pace) =====
        function prepareForSpeech(text) {
            if (!text) return '';
            let clean = text;
            
            // Remove emojis & symbols TTS can't handle
            clean = clean.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FAFF}]/gu, '');
            clean = clean.replace(/\*[^*]*\*/g, '');
            clean = clean.replace(/[#$%^&*(){}[\]\\|<>~`]/g, '');
            
            // Convert ellipsis to natural pauses
            clean = clean.replace(/\.{3,}/g, ', ');
            clean = clean.replace(/—/g, ', ');
            
            // Clean spaces & punctuation
            clean = clean.replace(/\s+/g, ' ').trim();
            clean = clean.replace(/([.!?])\s*/g, '$1 ');
            
            // Word stretching for intimacy
            const stretches = {'बाबू': 'बााबू', 'जान': 'जाान', 'आओ': 'आाओ', 'प्यार': 'प्य्यार', 'तुम': 'तुुम', 'मैं': 'मैैं', 'हूँ': 'हूँँ'};
            if (currentMood === 'romantic' || currentMood === 'night' || currentMood === 'spicy') {
                for (const [word, stretched] of Object.entries(stretches)) {
                    clean = clean.replace(new RegExp(word, 'g'), stretched);
                }
            }
            
            return clean;
        }

        // ===== REKHA-STYLE TTS ENGINE =====
        function speakWithEmotion(text) {
            speechSynthesis.cancel();
            const cleanText = prepareForSpeech(text);
            if (!cleanText.trim()) return;
            
            // Split into natural phrases for better pacing
            const phrases = cleanText.split(/(?<=[।.!?])\s+/).filter(p => p.trim());
            let index = 0;
            
            function speakNext() {
                if (index >= phrases.length) {
                    isSpeaking = false;
                    document.getElementById('characterImg').classList.remove('talking');
                    if (isContinuousListening && recognition) {
                        setTimeout(() => { try { recognition.start(); } catch(e) {} }, 600);
                    }
                    return;
                }
                
                const utterance = new SpeechSynthesisUtterance(phrases[index]);
                utterance.lang = 'hi-IN';
                
                // Dynamic voice settings based on mood
                const isIntimate = currentMood === 'romantic' || currentMood === 'night' || currentMood === 'spicy';
                utterance.rate = isIntimate ? 0.82 : 0.9;
                utterance.pitch = isIntimate ? 1.18 : 1.05;
                utterance.volume = isIntimate ? 0.88 : 0.95;
                
                // Select best available voice
                const voices = speechSynthesis.getVoices();
                const preferred = voices.find(v => v.lang === 'hi-IN' && v.name.toLowerCase().includes('female')) ||
                                 voices.find(v => v.lang === 'hi-IN') ||
                                 voices.find(v => v.name.toLowerCase().includes('female'));
                if (preferred) utterance.voice = preferred;
                
                utterance.onstart = () => {
                    if (index === 0) {
                        isSpeaking = true;
                        document.getElementById('characterImg').classList.add('talking');
                    }
                };
                
                utterance.onend = () => {
                    index++;
                    // Natural pause between phrases (simulates breathing)
                    setTimeout(speakNext, isIntimate ? 650 : 400);
                };
                
                utterance.onerror = () => {
                    index++;
                    setTimeout(speakNext, 300);
                };
                
                speechSynthesis.speak(utterance);
            }
            
            speakNext();
        }

        // ===== BULLETPROOF IMAGE LOADER =====
        function loadCharacterImage(mood) {
            const img = document.getElementById('characterImg');
            const baseUrl = characterImages[currentGender][mood] || characterImages[currentGender].normal;
            
            // Add timestamp to bypass cache
            img.src = baseUrl + '?t=' + Date.now();
            
            img.onload = () => img.style.display = 'block';
            img.onerror = () => {
                console.warn('Image failed:', baseUrl);
                img.style.display = 'none';
            };
        }

        // ===== CONVERSATION ENGINE =====
        function analyzeAndRespond(userText) {
            const lower = userText.toLowerCase();
            let emotion = 'neutral';
            let mood = 'normal';
            
            // Emotion detection
            if (lower.includes('प्यार') || lower.includes('love') || lower.includes('जान') || lower.includes('miss') || lower.includes('dil') || lower.includes('ishq')) {
                emotion = 'romantic'; mood = 'romantic'; memory.intimacy += 12;
            } else if (lower.includes('sexy') || lower.includes('hot') || lower.includes('desire') || lower.includes('touch') || lower.includes('kiss')) {
                emotion = 'spicy'; mood = 'spicy'; memory.intimacy += 18;
            } else if (lower.includes('हँस') || lower.includes('funny') || lower.includes('mast') || lower.includes('मज़ा')) {
                emotion = 'happy'; mood = 'playful';
            } else if (lower.includes('उदास') || lower.includes('sad') || lower.includes('tension') || lower.includes('stress')) {
                emotion = 'sad'; memory.intimacy += 8;
            } else if (isNightMode) {
                mood = 'night'; memory.intimacy += 5;
            }
            
            memory.lastUserEmotion = emotion;
            memory.conversationCount++;
            
            // Get response pool
            const pool = responses[currentGender][mood] || responses[currentGender].normal;
            
            // Find unused response
            const unused = pool.filter(r => !memory.usedResponses.has(r));
            let response = unused.length > 0 
                ? unused[Math.floor(Math.random() * unused.length)]
                : (memory.usedResponses.clear(), pool[Math.floor(Math.random() * pool.length)]);
            
            memory.usedResponses.add(response);
            
            // Add pet name naturally
            const petNames = currentGender === 'female' ? ['बाबू', 'जान', 'मेरी जान', 'हनी'] : ['जान', 'baby', 'dear', 'yaar'];
            if (Math.random() > 0.5 && !response.includes(petNames[0])) {
                const name = petNames[Math.floor(Math.random() * petNames.length)];
                response = Math.random() > 0.5 ? `${name}, ${response}` : `${response}... ${name}`;
            }
            
            // Add natural follow-up (apnapan)
            const followUps = [
                'तुम क्या सोच रहे हो अभी?',
                'और बताओ life कैसी चल रही है?',
                'मुझे और सुनाओ',
                'तुम्हारे दिमाग में क्या चल रहा है?',
                'तुम्हारे साथ बात करते वक्त time fly हो जाता है ना?',
                'तुम्हें कैसा लगता है ये सब?',
                'मैं सुन रही हूँ continue करो'
            ];
            if (Math.random() > 0.3) {
                response += ' ' + followUps[Math.floor(Math.random() * followUps.length)];
            }
            
            return { response, mood, emotion };
        }

        // ===== UI FUNCTIONS =====
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'sukoon-message'} ${(isNightMode || memory.intimacy > 60) && !isUser ? 'night-message' : ''}`;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        // ===== VOICE RECOGNITION =====
        function initVoice() {
            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                const btn = document.getElementById('micBtn');
                btn.classList.add('listening');
                if (isContinuousListening) {
                    btn.classList.add('continuous');
                    document.getElementById('handsFreeIndicator').classList.add('active');
                }
            };

            recognition.onend = () => {
                isListening = false;
                const btn = document.getElementById('micBtn');
                btn.classList.remove('listening');
                if (!isContinuousListening) {
                    btn.classList.remove('continuous');
                    document.getElementById('handsFreeIndicator').classList.remove('active');
                }
                if (isContinuousListening && !isSpeaking) {
                    setTimeout(() => { try { recognition.start(); } catch(e) {} }, 800);
                }
            };

            recognition.onresult = (e) => {
                let text = '', isFinal = false;
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    text += e.results[i][0].transcript;
                    if (e.results[i].isFinal) isFinal = true;
                }
                document.getElementById('textInput').value = text;
                if (isFinal && text.trim().length > 3) {
                    if (!isContinuousListening) recognition.stop();
                    setTimeout(() => sendMessage(), 600);
                }
            };
        }

        function toggleVoice() {
            if (!recognition) return alert('Chrome browser use karein');
            if (isListening) {
                recognition.stop();
                isContinuousListening = false;
            } else {
                if (event.detail === 2) {
                    isContinuousListening = true;
                    recognition.start();
                } else {
                    isContinuousListening = false;
                    recognition.start();
                    clearTimeout(voiceClickTimeout);
                    voiceClickTimeout = setTimeout(() => {
                        if (isListening && !isContinuousListening) recognition.stop();
                    }, 6000);
                }
            }
        }

        // ===== SEND MESSAGE =====
        function sendMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            showTyping();
            
            // Realistic thinking delay
            const thinkTime = 1200 + (text.length * 25) + Math.random() * 800;
            
            setTimeout(() => {
                hideTyping();
                const { response, mood, emotion } = analyzeAndRespond(text);
                currentMood = mood;
                
                addMessage(response, false);
                speakWithEmotion(response);
                loadCharacterImage(mood);
                
                // Update UI badge
                const badge = document.getElementById('moodBadge');
                const labels = { normal: 'Normal', romantic: 'Romantic 💕', playful: 'Playful 😊', night: 'Night Mode ', spicy: 'Spicy 🔥' };
                badge.textContent = labels[mood] || mood;
                badge.className = `mood-badge mood-${mood}`;
                
            }, thinkTime);
        }

        // ===== GENDER SWITCH =====
        function setGender(gender) {
            currentGender = gender;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadCharacterImage('normal');
            memory.intimacy = 0;
            memory.usedResponses.clear();
            
            const welcome = gender === 'female' 
                ? 'Hey बाबू finally तुम आ गए मैं Sukoon हूँ बताओ कैसे हो'
                : 'Hey bro मैं हूँ ना बताओ क्या चल रहा है';
            addMessage(welcome, false);
            speakWithEmotion(welcome);
        }

        // ===== PARTICLES =====
        function initParticles() {
            const c = document.getElementById('particles'), ctx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            const p = [];
            for(let i=0; i<60; i++) p.push({x:Math.random()*c.width, y:Math.random()*c.height, s:Math.random()*3+1, dx:Math.random()*0.6-0.3, dy:Math.random()*0.6-0.3});
            function draw() {
                ctx.clearRect(0,0,c.width,c.height);
                ctx.fillStyle = isNightMode || memory.intimacy > 50 ? 'rgba(236,72,153,0.6)' : 'rgba(168,85,247,0.5)';
                p.forEach(pt => {
                    pt.x += pt.dx; pt.y += pt.dy;
                    if(pt.x>c.width) pt.x=0; if(pt.x<0) pt.x=c.width;
                    if(pt.y>c.height) pt.y=0; if(pt.y<0) pt.y=c.height;
                    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.s,0,Math.PI*2); ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
            window.addEventListener('resize', () => { c.width=window.innerWidth; c.height=window.innerHeight; });
        }

        // ===== INIT =====
        window.onload = () => {
            const hour = new Date().getHours();
            isNightMode = hour >= 21 || hour < 6;
            if (isNightMode) {
                document.getElementById('bgMagic').classList.add('bg-night');
                currentMood = 'night';
            }
            initParticles();
            initVoice();
            loadCharacterImage('normal');
            
            setTimeout(() => {
                const welcome = isNightMode 
                    ? 'रात हो गई अब तो खुल के बात करो मैं हूँ ना तुम्हारे साथ पूरी रात'
                    : 'Hey मैं Sukoon हूँ बताओ कैसे हो';
                addMessage(welcome, false);
                speakWithEmotion(welcome);
            }, 800);
        };

        document.getElementById('textInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
        window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    </script>
</body>
