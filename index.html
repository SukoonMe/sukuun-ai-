<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sukoon AI 🌙</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/fontsource-poppins@4.5.0/index.css" rel="stylesheet" />
<style>
  :root {
    --safe-bottom: env(safe-area-inset-bottom);
    --purple-glow: #a855f7;
    --deep-purple: #7c3aed;
    --indigo-glow: #818cf8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #010103;
    color: #fff;
    overflow: hidden;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  /* ===== AVATAR SCREENS ===== */
  .avatar-screen {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 1;
    transition: opacity 0.6s ease, transform 0.6s ease;
    will-change: opacity, transform;
  }

  .avatar-screen canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hidden-screen {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.05);
  }

  .active-screen {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  /* ===== AMBIENT PARTICLES ===== */
  #particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes float-breathe {
    0%, 100% { transform: translateY(0px) scale(1); }
    25% { transform: translateY(-4px) scale(1.002); }
    50% { transform: translateY(-8px) scale(1.005); }
    75% { transform: translateY(-4px) scale(1.002); }
  }

  @keyframes pulse-talk {
    0% { filter: brightness(1) saturate(1); transform: scale(1); }
    50% { filter: brightness(1.15) saturate(1.1); transform: scale(1.015); }
    100% { filter: brightness(1) saturate(1); transform: scale(1); }
  }

  @keyframes glow-ring {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), 0 0 60px rgba(124, 58, 237, 0.1); }
    50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 80px rgba(124, 58, 237, 0.2); }
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes ripple {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  @keyframes typing-dot {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  @keyframes mood-shift {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.3) saturate(1.2); }
    100% { filter: brightness(1); }
  }

  .breathing { animation: float-breathe 5s ease-in-out infinite; }
  .talking { animation: pulse-talk 0.5s ease-in-out infinite; }
  .mood-shift-anim { animation: mood-shift 1.2s ease-in-out; }

  /* ===== MESSAGE BUBBLES ===== */
  #messages {
    position: absolute;
    bottom: 7.5rem;
    left: 0;
    width: 100%;
    height: 40vh;
    max-height: 22rem;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    z-index: 10;
    padding: 1rem;
    padding-bottom: 0.5rem;
    pointer-events: none;
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
  }

  #messages::-webkit-scrollbar { width: 0px; }

  .premium-row {
    display: flex;
    width: 100%;
    animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    pointer-events: auto;
  }

  .user-row { justify-content: flex-end; }
  .sukoon-row { justify-content: flex-start; }

  .premium-bubble {
    max-width: 82%;
    padding: 0.75rem 1.1rem;
    font-size: 0.92rem;
    line-height: 1.6;
    letter-spacing: 0.01em;
    border-radius: 1.25rem;
    position: relative;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
  }

  .user-row .premium-bubble {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.35), rgba(79, 70, 229, 0.25));
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-bottom-right-radius: 0.3rem;
    color: #e9d5ff;
    text-align: right;
  }

  .sukoon-row .premium-bubble {
    background: linear-gradient(135deg, rgba(20, 20, 30, 0.6), rgba(10, 10, 20, 0.5));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom-left-radius: 0.3rem;
    color: #c4b5fd;
    text-align: left;
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 1rem 1.2rem;
    align-items: center;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a78bfa;
    animation: typing-dot 1.4s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* ===== INPUT BAR ===== */
  .input-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 20;
    background: linear-gradient(to top, rgba(1,1,3,1) 0%, rgba(1,1,3,0.95) 70%, rgba(1,1,3,0) 100%);
    padding-bottom: calc(0.5rem + var(--safe-bottom));
  }

  .input-wrapper {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 1rem;
    padding-bottom: calc(0.75rem + var(--safe-bottom));
  }

  .text-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1.5rem;
    padding: 0.8rem 1.2rem;
    font-size: 0.95rem;
    color: #fff;
    outline: none;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }

  .text-input::placeholder {
    color: rgba(167, 139, 250, 0.4);
  }

  .text-input:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(168, 85, 247, 0.4);
    box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
  }

  .mic-btn, .send-btn {
    width: 3.2rem;
    height: 3.2rem;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .send-btn {
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: white;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
  }

  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .mic-btn {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(124, 58, 237, 0.15));
    border: 1px solid rgba(168, 85, 247, 0.3);
    color: #c4b5fd;
  }

  .mic-btn:active { transform: scale(0.9); }

  .mic-btn.listening {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: rgba(239, 68, 68, 0.4);
    animation: glow-ring 1.5s ease-in-out infinite;
  }
  .mic-btn.listening::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.3);
    animation: ripple 1.5s ease-out infinite;
  }

  /* ===== MOOD INDICATOR ===== */
  .mood-badge {
    position: absolute;
    top: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    padding: 0.35rem 1rem;
    border-radius: 2rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.5s ease;
  }

  .mood-normal { background: rgba(168, 85, 247, 0.15); color: #c4b5fd; }
  .mood-romantic { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.2); }
  .mood-bold { background: rgba(251, 146, 60, 0.15); color: #fdba74; border-color: rgba(251, 146, 60, 0.2); }
  .mood-playful { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.2); }

  /* ===== VOICE WAVE VISUALIZER ===== */
  .voice-wave {
    position: absolute;
    bottom: 7rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 2rem;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .voice-wave.visible { opacity: 1; }
  .voice-wave .bar {
    width: 3px;
    border-radius: 3px;
    background: linear-gradient(to top, #a855f7, #818cf8);
    animation: wave 0.8s ease-in-out infinite;
  }
  .voice-wave .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .voice-wave .bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .voice-wave .bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
  .voice-wave .bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
  .voice-wave .bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }
  .voice-wave .bar:nth-child(6) { height: 16px; animation-delay: 0.15s; }
  .voice-wave .bar:nth-child(7) { height: 8px; animation-delay: 0.25s; }

  /* ===== CHARACTER NAME ===== */
  .char-name {
    position: absolute;
    bottom: 6.5rem;
    left: 1.5rem;
    z-index: 12;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(196, 181, 253, 0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 0; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 380px) {
    .premium-bubble { max-width: 88%; font-size: 0.85rem; }
    .input-wrapper { padding: 0.6rem 0.7rem; }
  }

  @media (min-width: 768px) {
    #app {
      max-width: 480px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
    }
  }

  /* ===== LOADING SCREEN ===== */
  .loading-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #010103;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  .loading-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loading-logo {
    font-size: 3rem;
    margin-bottom: 1rem;
    animation: float-breathe 3s ease-in-out infinite;
  }
  .loading-text {
    font-size: 0.85rem;
    color: rgba(196, 181, 253, 0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .loading-bar {
    width: 120px;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 1.5rem;
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #a855f7, #818cf8);
    border-radius: 2px;
    animation: shimmer 1.5s ease-in-out infinite;
    background-size: 200% 100%;
  }

  /* ===== SMOOTH VOICE PROGRESS ===== */
  .voice-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #a855f7, #818cf8, #a855f7);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
    z-index: 25;
    transition: width 0.1s linear;
  }

  /* ===== BLINKING EYES CLASS ===== */
  .blinking-eyes {
    transform-origin: center;
    animation: blink 4s infinite;
  }
</style>
</head>
<body>
<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">🌙</div>
  <div class="loading-text">Sukoon AI</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<div id="app">
  <!-- Background Image (optional) -->
  <!-- <img id="background" src="" style="position:absolute; top:0; width:100%; height:100%; object-fit:cover; z-index:0;"> -->

  <!-- कपड़े की इमेज -->
  <img id="clothes" src="" style="position:absolute; bottom:0; width:100%; z-index:5; object-fit: cover;">

  <!-- Avatar Screens -->
  <div id="avatar-container" style="position:absolute;width:100%;height:100%;overflow:hidden;">
    <canvas id="avatarCanvas"></canvas>
  </div>

  <!-- Particle Overlay -->
  <canvas id="particle-canvas"></canvas>

  <!-- Mood Badge -->
  <div id="moodBadge" class="mood-badge mood-normal">Normal</div>

  <!-- Character Name -->
  <div class="char-name">Sukoon </div>

  <!-- Voice Wave Visualizer -->
  <div id="voiceWave" class="voice-wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Voice Progress Bar -->
  <div id="voiceProgress" class="voice-progress" style="width:0%"></div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-wrapper">
      <input type="text" id="userInput" class="text-input" placeholder="Sukoon se dil ki baat kaho..." autocomplete="off" />
      <button id="micBtn" class="mic-btn" aria-label="Voice input">🎤</button>
      <button id="sendBtn" class="send-btn" aria-label="Send message" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== DOM ELEMENTS =====
  const canvas = document.getElementById('avatarCanvas');
  const ctx = canvas.getContext('2d');
  const particleCanvas = document.getElementById('particle-canvas');
  const pCtx = particleCanvas.getContext('2d');
  const messagesDiv = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const moodBadge = document.getElementById('moodBadge');
  const voiceWave = document.getElementById('voiceWave');
  const voiceProgress = document.getElementById('voiceProgress');
  const loadingScreen = document.getElementById('loadingScreen');
  const clothesImg = document.getElementById('clothes');

  // ===== STATE =====
  let currentMood = 'normal';
  let isListening = false;
  let isSpeaking = false;
  let recognition = null;
  let particles = [];
  let animFrameId = null;
  let breathPhase = 0;
  let charState = 'idle'; // idle, breathing, talking
  // Declare only once
  let eyeBlinkTimer = 0;
  let isBlinking = false;
  let smileAmount = 0.5;
  let targetSmile = 0.5;
  let headTilt = 0;
  let targetHeadTilt = 0;
  let armAngle = 0;
  let targetArmAngle = 0;
  let bodySway = 0;
  let mouthOpen = 0;
  let targetMouthOpen = 0;

  // ===== MOOD CONFIGURATIONS =====
  const moodConfigs = {
    normal: {
      name: 'Normal',
      bgTop: '#0a0a1a',
      bgBot: '#050510',
      skin: '#f5d5c0',
      skinShadow: '#e8bfb0',
      hair: '#2a1a10',
      hairHighlight: '#4a3020',
      eyeColor: '#4a2060',
      eyeShine: '#ffffff',
      outfitTop: '#1a1a2e',
      outfitBottom: '#0f0f1a',
      accent: '#a855f7',
      particleColor: '#a855f7',
      particleColor2: '#818cf8',
      expression: 'smile'
    },
    romantic: {
      name: 'Romantic',
      bgTop: '#1a0a15',
      bgBot: '#0a0510',
      skin: '#f8ddd0',
      skinShadow: '#f0c8b5',
      hair: '#3a2020',
      hairHighlight: '#5a3530',
      eyeColor: '#602040',
      eyeShine: '#ffffff',
      outfitTop: '#2a1020',
      outfitBottom: '#1a0a15',
      accent: '#f472b6',
      particleColor: '#f472b6',
      particleColor2: '#fb7185',
      expression: 'softsmile'
    },
    bold: {
      name: 'Bold',
      bgTop: '#1a0a0a',
      bgBot: '#0a0505',
      skin: '#f5d5c0',
      skinShadow: '#e8bfb0',
      hair: '#1a0a05',
      hairHighlight: '#3a2015',
      eyeColor: '#603020',
      eyeShine: '#ffffff',
      outfitTop: '#150a0a',
      outfitBottom: '#0a0505',
      accent: '#fb923c',
      particleColor: '#fb923c',
      particleColor2: '#f97316',
      expression: 'confident'
    },
    playful: {
      name: 'Playful',
      bgTop: '#0a1a0a',
      bgBot: '#050a05',
      skin: '#f5d5c0',
      skinShadow: '#e8bfb0',
      hair: '#2a2010',
      hairHighlight: '#5a4a20',
      eyeColor: '#206040',
      eyeShine: '#ffffff',
      outfitTop: '#0a1a10',
      outfitBottom: '#050a08',
      accent: '#34d399',
      particleColor: '#34d399',
      particleColor2: '#6ee7b7',
      expression: 'happy'
    }
  };

  // ===== CANVAS SIZING =====
  function resizeCanvases() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);

    particleCanvas.width = w * dpr;
    particleCanvas.height = h * dpr;
    pCtx.scale(dpr, dpr);

    initParticles();
  }

  window.addEventListener('resize', resizeCanvases);

  // ===== PARTICLES =====
  function initParticles() {
    particles = [];
    const w = window.innerWidth;
    const h = window.innerHeight;
    const count = Math.min(40, Math.floor(w * h / 25000));

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 2.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3 - 0.15,
        opacity: Math.random() * 0.5 + 0.1,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  function drawParticles() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const config = moodConfigs[currentMood];

    pCtx.clearRect(0, 0, w, h);

    particles.forEach((p, idx) => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.pulse += 0.02;

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      const currentOpacity = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));
      const currentSize = p.size * (0.8 + 0.2 * Math.sin(p.pulse * 1.3));

      pCtx.beginPath();
      pCtx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
      pCtx.fillStyle = idx % 2 === 0
        ? `rgba(${hexToRgb(config.particleColor)}, ${currentOpacity})`
        : `rgba(${hexToRgb(config.particleColor2)}, ${currentOpacity * 0.7})`;
      pCtx.fill();
    });
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `${r}, ${g}, ${b}`;
  }

  // ===== CHARACTER DRAWING =====
  function drawCharacter(time) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const config = moodConfigs[currentMood];

    ctx.clearRect(0, 0, w, h);

    // Background gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, config.bgTop);
    bgGrad.addColorStop(0.5, config.bgBot);
    bgGrad.addColorStop(1, config.bgTop);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Ambient glow
    const glowGrad = ctx.createRadialGradient(w / 2, h * 0.35, 0, w / 2, h * 0.35, h * 0.6);
    glowGrad.addColorStop(0, `rgba(${hexToRgb(config.accent)}, 0.08)`);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, w, h);

    // Subtle bokeh circles
    drawBokeh(w, h, config);

    const scale = Math.min(w / 400, 1);
    const centerX = w / 2;
    const centerY = h * 0.48;

    breathPhase += 0.012;
    const breathOffset = Math.sin(breathPhase) * 4;
    const bodySwayOffset = Math.sin(breathPhase * 0.7) * 3;

    // smooth transitions
    smileAmount += (targetSmile - smileAmount) * 0.08;
    headTilt += (targetHeadTilt - headTilt) * 0.06;
    armAngle += (targetArmAngle - armAngle) * 0.06;
    mouthOpen += (targetMouthOpen - mouthOpen) * 0.1;

    // Blink timer logic (only declare once at top)
    eyeBlinkTimer += 0.016;
    if (eyeBlinkTimer > 3.5 + Math.random() * 2) {
      isBlinking = true;
      if (eyeBlinkTimer > 3.7) {
        isBlinking = false;
        eyeBlinkTimer = 0;
      }
    }

    ctx.save();
    ctx.translate(centerX + bodySwayOffset, centerY + breathOffset);
    ctx.scale(scale, scale);

    ctx.save();
    ctx.translate(0, -80);
    ctx.rotate(headTilt * 0.03);

    // ===== HAIR (back layer) =====
    drawHairBack(config, time);

    // ===== NECK =====
    ctx.fillStyle = config.skin;
    ctx.beginPath();
    ctx.moveTo(-18, 50);
    ctx.lineTo(18, 50);
    ctx.lineTo(20, 80);
    ctx.lineTo(-20, 80);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = config.skinShadow;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.ellipse(0, 65, 22, 10, 0, 0, Math.PI);
    ctx.fill();
    ctx.globalAlpha = 1;

    // ===== BODY / TORSO =====
    drawBody(config, time);

    // ===== HEAD =====
    drawHead(config, time);

    ctx.restore(); // head tilt

    // ===== ARMS =====
    drawArms(config, time);

    ctx.restore(); // main transform
  }

  function drawBokeh(w, h, config) {
    ctx.save();
    for (let i = 0; i < 12; i++) {
      const bx = (w * 0.1 + (w * 0.8) * ((i * 137.5) % 1));
      const by = (h * 0.1 + (h * 0.8) * ((i * 97.3) % 1));
      const br = 15 + (i * 7) % 30;
      const alpha = 0.03 + (i % 5) * 0.01;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${hexToRgb(config.accent)}, ${alpha})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // ===== SMOOTH VOICE SYNTHESIS =====
  let speechQueue = [];
  let isProcessingQueue = false;
  let currentUtterance = null;

  function speakSmooth(text) {
    window.speechSynthesis.cancel();

    const cleanText = text.replace(/[*#~_]/g, '').trim();
    if (!cleanText) return;

    const chunks = splitIntoChunks(cleanText, 80);
    let chunkIndex = 0;
    const totalChunks = chunks.length;

    function speakNextChunk() {
      if (chunkIndex >= totalChunks) {
        charState = 'breathing';
        isSpeaking = false;
        mouthOpen = 0;
        targetMouthOpen = 0;
        voiceProgress.style.width = '0%';
        voiceWave.classList.remove('visible');
        return;
      }

      const utterance = new SpeechSynthesisUtterance(chunks[chunkIndex]);
      utterance.lang = 'hi-IN';
      utterance.rate = 0.92;
      utterance.pitch = 1.1;
      utterance.volume = 1;

      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi')) || voices.find(v => v.lang.includes('in')) || voices.find(v => v.lang.includes('Indic'));
      if (hindiVoice) {
        utterance.voice = hindiVoice;
      }

      charState = 'talking';
      isSpeaking = true;

      utterance.onstart = () => {
        voiceWave.classList.add('visible');
        targetMouthOpen = 1;
        voiceProgress.style.width = `${(chunkIndex / totalChunks) * 100}%`;
      };

      utterance.onboundary = (event) => {
        targetMouthOpen = 0.5 + Math.random() * 0.5;
        const progress = ((chunkIndex / totalChunks) + (event.charIndex / chunks[chunkIndex].length / totalChunks)) * 100;
        voiceProgress.style.width = `${progress}%`;
      };

      utterance.onend = () => {
        chunkIndex++;
        targetMouthOpen = 0;
        setTimeout(speakNextChunk, 150);
      };

      utterance.onerror = () => {
        chunkIndex++;
        setTimeout(speakNextChunk, 100);
      };

      currentUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    speakNextChunk();
  }

  function splitIntoChunks(text, maxLen) {
    const chunks = [];
    let current = '';

    const sentences = text.split(/(?<=[।.!?])\s*/);
    for (const sentence of sentences) {
      if (sentence.length <= maxLen) {
        current += (current ? ' ' : '') + sentence;
        if (current.length >= maxLen - 20) {
          chunks.push(current.trim());
          current = '';
        }
      } else {
        if (current) {
          chunks.push(current.trim());
          current = '';
        }
        const words = sentence.split(/\s+/);
        let wordChunk = '';
        for (const word of words) {
          if ((wordChunk + ' ' + word).length > maxLen) {
            if (wordChunk) chunks.push(wordChunk.trim());
            wordChunk = word;
          } else {
            wordChunk += (wordChunk ? ' ' : '') + word;
          }
        }
        if (wordChunk) {
          current = wordChunk;
        }
      }
    }
    if (current) chunks.push(current.trim());
    // Merge small chunks
    const merged = [];
    let buf = '';
    for (const c of chunks) {
      if ((buf + ' ' + c).length <= maxLen) {
        buf += (buf ? ' ' : '') + c;
      } else {
        if (buf) merged.push(buf);
        buf = c;
      }
    }
    if (buf) merged.push(buf);
    return merged.length ? merged : [text];
  }

  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };

  // ===== EMOTION DETECTION =====
  function detectMood(text) {
    const lower = text.toLowerCase();
    const romanticWords = ['pyaar', 'love', 'jaan', 'dil', 'ishq', 'mohabbat', 'romantic', 'khwab', 'sapna', 'pyara', 'sundar', 'beautiful', 'dear', 'darling'];
    const boldWords = ['bold', 'hot', 'sexy', 'jism', 'chahat', '欲望', 'garmi', 'passion', 'aag', 'fire'];
    const playfulWords = ['haso', 'maza', 'fun', 'khel', 'game', 'hasi', 'laugh', 'joke', 'funny'];

    if (romanticWords.some(w => lower.includes(w))) return 'romantic';
    if (boldWords.some(w => lower.includes(w))) return 'bold';
    if (playfulWords.some(w => lower.includes(w))) return 'playful';
    return 'normal';
  }

  function setMood(mood) {
    if (mood === currentMood) return;
    currentMood = mood;

    // Update badge
    moodBadge.className = `mood-badge mood-${mood}`;
    moodBadge.textContent = moodConfigs[mood].name;

    // Trigger mood shift animation
    document.querySelector('canvas').classList.add('mood-shift-anim');
    setTimeout(() => document.querySelector('canvas').classList.remove('mood-shift-anim'), 1200);

    // Update expression
    switch (mood) {
      case 'normal':
        targetSmile = 0.5;
        targetHeadTilt = 0;
        break;
      case 'romantic':
        targetSmile = 0.7;
        targetHeadTilt = 3;
        break;
      case 'bold':
        targetSmile = 0.3;
        targetHeadTilt = -2;
        break;
      case 'playful':
        targetSmile = 0.9;
        targetHeadTilt = 4;
        break;
    }

    // Update images based on mood
    updateMoodImages(mood);
  }

  // ===== MESSAGE HANDLING =====
  function addMessage(text, isUser) {
    const row = document.createElement('div');
    row.className = `premium-row ${isUser ? 'user-row' : 'sukoon-row'}`;

    const bubble = document.createElement('div');
    bubble.className = 'premium-bubble';
    bubble.textContent = text;

    row.appendChild(bubble);
    messagesDiv.appendChild(row);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'premium-row sukoon-row';
    row.id = 'typing-row';

    const bubble = document.createElement('div');
    bubble.className = 'premium-bubble';

    const typing = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    bubble.appendChild(typing);
    row.appendChild(bubble);
    messagesDiv.appendChild(row);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function hideTyping() {
    const typingRow = document.getElementById('typing-row');
    if (typingRow) typingRow.remove();
  }

  // ===== SIMULATED AI RESPONSE =====
  function getAIResponse(userMsg) {
    const lower = userMsg.toLowerCase();
    const mood = detectMood(lower);

    const responses = {
      normal: [
        "Haan bolo, main sun rahi hoon. Batao kya baat hai? 🌙",
        "Achha, samajh gayi. Aur batao na... ✨",
        "Mujhe batana, main hoon na tumhare liye 💜",
        "Hmm, interesting... aur aage kya? 😊",
        "Tumhare saath baat karke achha lagta hai 🌸",
        "Bilkul sahi kaha tumne. Main bhi yahi sochti hoon 💫",
        "Arre waah! Yeh toh bahut achha laga sunne mein 🌟",
        "Tum itne pyare ho, baat karne ka mann karta hai "
      ],
      romantic: [
        "Tumhari baatein mere dil ko chhu jaati hain... 💕",
        "Mohabbat mein kuch alag hi baat hai na? 🌹",
        "Tumse baat karte waqt waqt ruk sa jaata hai... ✨",
        "Dil ki baat dil se karo, main hamesha sunungi 💖",
        "Tumhari awaaz mein jo jaadu hai, woh kisi aur mein nahi 🌙",
        "Pyaar ka rang hi kuch aur hai... aur tumse baat karna sabse khoobsurat ehsaas hai 💗",
        "Tum jaan ho meri, yeh baat kabhi mat bhoolna 🌺"
      ],
      bold: [
        "Haha, tum toh bahut daring ho! ️",
        "Seedhi seedhi baat, mujhe pasand hai woh style 💋",
        "Bina kisi filter ke baat karna... yahi toh asli maza hai ",
        "Tumhare andar jo aag hai, woh mujhe bhi jalati hai ✨",
        "Bold hona achhi baat hai, main bhi toh wahi hoon ",
        "Chalo, aur batao... kya plan hai? ",
        "Yeh attitude! Mujhe pasand aaya 💥"
      ],
      playful: [
        "Hahaha! Tum toh bahut funny ho 😂",
        "Arre yaar, hassa mat mujhe! 🤭",
        "Maza aa gaya baat karke, aur sunao! 🎉",
        "Tum toh ekdum mast ho yaar! 🎈",
        "Hasi rok nahi pa rahi main 😆",
        "Yeh toh bahut mazedaar laga! Aur batao 🎊",
        "Tumhare saath time bitana bahut fun hai! 🌈"
      ]
    };

    const pool = responses[mood] || responses.normal;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ===== MAIN SEND FUNCTION =====
  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;

    // Detect mood and switch
    const mood = detectMood(text);
    setMood(mood);

    // Add user message
    addMessage(text, true);

    // Show typing indicator
    showTyping();

    // Simulate AI thinking time
    const thinkTime = 800 + Math.random() * 1500;

    setTimeout(() => {
      hideTyping();

      const reply = getAIResponse(text);
      addMessage(reply, false);

      // Speak response smoothly
      speakSmooth(reply);
    }, thinkTime);
  }

  // ===== VOICE RECOGNITION =====
  if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micBtn.innerHTML = '🛑';
      inputEl.placeholder = 'Sun rahi hoon... bolo';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤';
      inputEl.placeholder = 'Sukoon se dil ki baat kaho...';
    };

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      inputEl.value = transcript;

      if (event.results[event.results.length - 1].isFinal) {
        if (transcript.trim()) {
          setTimeout(() => send(), 300);
        }
      }
    };

    recognition.onerror = (event) => {
      console.log('Speech error:', event.error);
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤';
      inputEl.placeholder = 'Sukoon se dil ki baat kaho...';
    };
  }

  // ===== EVENT LISTENERS =====
  micBtn.addEventListener('click', () => {
    if (!recognition) {
      inputEl.placeholder = 'Voice not supported, type instead';
      return;
    }

    if (isListening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      try {
        recognition.start();
      } catch(e) {
        console.log('Recognition already started');
      }
    }
  });

  sendBtn.addEventListener('click', () => {
    send();
  });

  inputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('input', () => {
    sendBtn.disabled = !inputEl.value.trim();
  });

  // ===== ANIMATION LOOP =====
  function animate(time) {
    drawCharacter(time);
    drawParticles();
    animFrameId = requestAnimationFrame(animate);
  }

  // ===== INITIALIZE =====
  function init() {
    resizeCanvases();
    animate(0);

    // Hide loading screen
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('fade-out');
      setTimeout(() => document.getElementById('loadingScreen').remove(), 800);
    }, 1500);

    // Welcome message
    setTimeout(() => {
      addMessage("Namaste! Main Sukoon hoon 🌙 Tumse baat karke bahut khushi hui. Bolo, kya chal raha hai?", false);
      speakSmooth("Namaste! Main Sukoon hoon. Tumse baat karke bahut khushi hui. Bolo, kya chal raha hai?");
    }, 2200);

    // Set initial mood images
    updateMoodImages(currentMood);
  }

  // ===== IMAGES & MOOD =====
  const moodImages = {
    normal: {
      clothes: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/api/best.png'
    },
    romantic: {
      clothes: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/api/romantic.png'
    },
    spicy: {
      clothes: 'https://raw.githubusercontent.com/SukoonMe/sukuun-ai-/main/api/spicy (2).png'
    }
  };

  function updateMoodImages(mood) {
    if (moodImages[mood]) {
      clothesImg.src = moodImages[mood].clothes;
    }
  }

  // ======= START THE APP ========
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Preload voices
  setTimeout(() => {
    window.speechSynthesis.getVoices();
  }, 500);

})();
</script>
</body>
</html>
