<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #sukuun-img { height: 60vh; background-size: cover; background-position: center; transition: 0.5s; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="h-screen flex justify-center items-center">
    <div id="app" class="w-full max-w-md h-full flex flex-col">
        <div id="sukuun-img" class="w-full"></div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-4 glass">
            <input type="text" id="userInput" class="w-full p-3 rounded-2xl bg-black/20 text-white outline-none" placeholder="Sukoon se kuch kaho...">
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId') || 'u_' + Date.now();
        localStorage.setItem('userId', userId);
        document.getElementById('sukuun-img').style.backgroundImage = "url('/best_female.png')";

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            document.getElementById('messages').innerHTML += `<div class="p-3 bg-indigo-600 rounded-xl self-end">${input.value}</div>`;
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, userId })
            });
            const data = await res.json();
            
            document.getElementById('messages').innerHTML += `<div class="p-3 glass rounded-xl self-start">${data.reply}</div>`;
            input.value = '';
            
            // Clean Voice
            const speech = new SpeechSynthesisUtterance(data.reply.replace(/[^\w\s.,?!]/g, ""));
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
