<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        /* Ambient Glow Layer */
        .glow-fixed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        
        #app { width: 100%; max-width: 420px; height: 100vh; margin: auto; display: flex; flex-direction: column; position: relative; z-index: 1; }
        #sukuun-img { flex: 1; background-size: cover; background-position: top; transition: 0.5s; }
        
        /* Chat Box Design */
        .chat-container { background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding: 20px; }
        .input-wrap { background: #111; border: 1px solid #333; border-radius: 20px; display: flex; align-items: center; padding: 5px 15px; }
        input { background: transparent; color: white; border: none; padding: 10px; width: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="glow-fixed">
        <div class="animate-ambient-1 absolute w-[300px] h-[300px] bg-indigo-500/20 rounded-full -top-20 -left-20 blur-3xl"></div>
        <div class="animate-ambient-2 absolute w-[300px] h-[300px] bg-rose-500/20 rounded-full bottom-0 right-0 blur-3xl"></div>
    </div>

    <div id="app">
        <div id="sukuun-img"></div>
        <div class="chat-container">
            <div id="messages" class="h-48 overflow-y-auto mb-4 space-y-3"></div>
            <div class="input-wrap">
                <input type="text" id="userInput" placeholder="Sukoon se baat karo...">
                <button onclick="send()" class="text-indigo-400 font-bold">Send</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sukuun-img').style.backgroundImage = "url('/best.png')";
        
        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            
            // UI Feedback
            const msgBox = document.getElementById('messages');
            msgBox.innerHTML += `<div class="text-right text-sm text-gray-400">${input.value}</div>`;
            const userMsg = input.value;
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: userMsg, userId: localStorage.getItem('userId') })
            });
            const data = await res.json();
            
            msgBox.innerHTML += `<div class="text-indigo-200 text-sm">Sukoon: ${data.reply}</div>`;
            msgBox.scrollTop = msgBox.scrollHeight;

            const cleanText = data.reply.replace(/[\*\#\_\`\~]/g, "");
            const speech = new SpeechSynthesisUtterance(cleanText);
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
