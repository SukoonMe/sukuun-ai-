<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon AI 🌙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css"> <style>
        body { background: #050505; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #app { width: 100%; max-width: 400px; height: 90vh; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; position: relative; z-index: 10; }
        
        /* Ambient Backgrounds */
        .glow { position: absolute; width: 200px; height: 200px; background: #f43f5e; filter: blur(100px); border-radius: 50%; z-index: 0; }
        
        #sukuun-img { height: 45vh; background-size: cover; background-position: top; transition: 0.5s; animation: float 6s infinite ease-in-out; border-bottom: 1px solid rgba(255,255,255,0.1); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-family: 'Inter', sans-serif; }
        .ai { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); align-self: flex-start; }
        .user { background: #f43f5e; color: white; align-self: flex-end; }
        
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; color: white; width: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="glow animate-ambient-1" style="top: 10%; left: 10%;"></div>
    <div class="glow animate-ambient-2" style="bottom: 10%; right: 10%;"></div>

    <div id="app">
        <div id="sukuun-img"></div>
        <div id="messages"></div>
        <div class="p-5">
            <input type="text" id="userInput" placeholder="Dil ki baat kaho..." onkeypress="if(event.key==='Enter') send()">
        </div>
    </div>

    <script>
        // Setup Logic
        let userId = localStorage.getItem('userId') || 'u_' + Date.now();
        let gender = localStorage.getItem('gender') || (confirm("Sukoon ka avatar female ho?") ? 'female' : 'male');
        let userAge = localStorage.getItem('userAge') || '20';
        localStorage.setItem('userId', userId); localStorage.setItem('gender', gender);

        document.getElementById('sukuun-img').style.backgroundImage = `url('/${gender === 'male' ? 'best_female.png' : 'best_male.png'}')`;

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            document.getElementById('messages').innerHTML += `<div class="msg user">${input.value}</div>`;
            const userMsg = input.value; input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: userMsg, userId, gender, userAge })
                });
                const data = await res.json();
                document.getElementById('messages').innerHTML += `<div class="msg ai">${data.reply}</div>`;
                
                // Voice Fix: Clearer synthesis
                const speech = new SpeechSynthesisUtterance(data.reply);
                speech.lang = 'hi-IN';
                window.speechSynthesis.speak(speech);
            } catch(e) { alert("Sukoon busy hai... 🌸"); }
        }
    </script>
</body>
</html>
