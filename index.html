<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukuun AI 🌙</title>
    <style>
        body { margin:0; background: #0c0f1d; color: white; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { width: 90%; max-width: 400px; height: 85vh; background: #1e293b; border-radius: 30px; border: 2px solid #4f46e5; display: flex; flex-direction: column; overflow: hidden; }
        
        #sukuun-img { height: 250px; background-size: cover; background-position: center; transition: all 0.5s ease; border-bottom: 2px solid #4f46e5; }
        
        .speaking { filter: brightness(1.3) saturate(1.2); transform: scale(1.05); box-shadow: 0 0 30px rgba(79, 70, 229, 0.6); }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 85%; }
        .ai { background: #334155; align-self: flex-start; }
        .user { background: #4f46e5; align-self: flex-end; }
        
        .input-area { padding: 20px; background: #0f172a; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 10px; border: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sukuun-img" style="background-image: url('/female-look.png');"></div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Dil ki baat kaho...">
            <button onclick="send()">भेजो</button>
        </div>
    </div>

    <script>
        const userProfile = { name: 'Yaar', gender: 'male' }; 
        const img = document.getElementById('sukuun-img');

        async function send() {
            const input = document.getElementById('userInput');
            if(!input.value.trim()) return;
            
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div class="msg user">${input.value}</div>`;
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, userProfile })
            });
            const data = await res.json();
            
            // Image Switch
            img.style.backgroundImage = data.avatarType === 'female' ? "url('/female-look.png')" : "url('/male-look.png')";
            
            msgDiv.innerHTML += `<div class="msg ai">${data.reply}</div>`;
            
            const speech = new SpeechSynthesisUtterance(data.reply);
            speech.lang = 'hi-IN';
            img.classList.add('speaking');
            speech.onend = () => img.classList.remove('speaking');
            window.speechSynthesis.speak(speech);
            input.value = '';
        }
    </script>
</body>
</html>
